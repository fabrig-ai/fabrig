[workspace.lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
single_match_else = "allow"
wildcard_enum_match_arm = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
impl_trait_in_params = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
allow_attributes = "deny"
match_wildcard_for_single_variants = "deny"
enum_glob_use = "deny"
wildcard_imports = "deny"
panic = "deny"
missing_assert_message = "deny"
assertions_on_result_states = "deny"
unused_result_ok = "deny"
let_underscore_untyped = "deny"
mixed_read_write_in_expression = "deny"
infinite_loop = "deny"
empty_drop = "deny"
exit = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"
host_endian_bytes = "deny"
fn_to_numeric_cast_any = "deny"
default_numeric_fallback = "deny"
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"
alloc_instead_of_core = "deny"
partial_pub_fields = "deny"
mod_module_files = "deny"
tests_outside_test_module = "deny"
iter_over_hash_type = "deny"

[workspace.lints.clippy.pedantic]
level = "warn"
priority = -1

[profile.dev]
overflow-checks = true
# Line tables alone for the workspace's own crates: panics and backtraces keep file and line, and each
# test executable, linked anew in every target directory, sheds most of its size.
debug = "line-tables-only"

[profile.dev.package]

[profile.dev.package."*"]
debug = false

[profile.dev.package.skein-ui-bundle]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.rustls]
debug-assertions = false

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.jig-boundary]
opt-level = 3

[profile.dev.package.fabrig-boundary]
opt-level = 3

[profile.dev.package.skein-codegen]
opt-level = 3

[profile.dev.package.skein-lib]
opt-level = 3

[profile.release]
panic = "abort"
overflow-checks = true

[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[profile.playground]
inherits = "web"
opt-level = "z"
