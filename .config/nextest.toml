# The workspace's focused, fuzzy, and tier profiles.
#
# The focused suite, profile default, is each tree's focused suite: every test
# but the fuzzy ones and the tiers' binaries (process, live, QA, browser,
# exhaustive). The fuzzy suite, profile fuzzy,
# is each tree's fuzzy suite: the `fuzzy` module
# of a package's `suite` binary. Each tree's filter is its own, restricted to the
# packages under its directory (cargo metadata), joined with |.
#
#   skein:  package(/^skein-/), and forgejo-conformance, github-conformance
#   smith:  package(/^smith(-|$)/)
#   jig:    package(/^jig(-|$)/)
#   temper: package(/^temper(-|$)/), and git-transcripts
#
# and the repository's own checks, under tests/ at the root:
#
#   fabrig: package(=fabrig-boundary)
#
# The tier profiles are exhaustive-skein, browser-skein, live-skein, qa-skein;
# live-smith, qa-smith; qa-jig, process-jig, live-jig, browser-jig; and
# process-temper, live-temper, qa-temper, browser-temper. Each keeps its tree's
# own budget.
#
# Each tree's budget was 30 s focused and 120 s fuzzy, doubled provisionally
# at the user's request on 10-22; the workspace's is their sum, until the
# suites are timed together. Slow periods only flag a test SLOW as it runs
# (none terminates); each tree keeps its own.

# CPU contention inflates real-loop work without runnable wait, which
# skein/docs/foundation/testing-strategy.md 2.10's starvation rule cannot see.
[test-groups]
temper-real-loop = { max-threads = 2 }

[profile.default]
default-filter = """
(
  (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))
  & not (kind(test) & test(/^fuzzy::/)) & not binary(/^browser_/) & not binary(=live)
  & not binary(/^exhaustive_/) & not binary(/^qa_/)
) | (
  package(/^smith(-|$)/)
  & not (kind(test) & test(/^fuzzy::/)) & not binary(/^qa_/)
  & not ((package(=smith) | package(=smith-agent-process-world)) & binary(=live))
) | (
  package(/^jig(-|$)/)
  & not (kind(test) & test(/^fuzzy::/))
  & (not binary(/^(process|live)$/) | (binary(=live) & test(=the_live_configurations_are_ones_jig_test_reads)))
  & not binary(/^browser_/) & not binary(/^qa_/)
) | (
  (package(/^temper(-|$)/) | package(=git-transcripts))
  & not test(/^tests::sign_in::fuzzy_/) & not (kind(test) & test(/^fuzzy::/))
  & not binary(/^(process|live|live_github)$/)
  & not binary(/^qa_/) & not test(/::qa_/) & not binary(/^browser_/)
) | package(=fabrig-boundary)
"""
global-timeout = "120s"
slow-timeout = { period = "6s" }

[[profile.default.overrides]]
filter = "package(=temper-real-loop-world) & kind(test)"
test-group = "temper-real-loop"

# jig's slow period was one second; the other trees' six.
[[profile.default.overrides]]
filter = "package(/^jig(-|$)/)"
slow-timeout = { period = "1000ms" }

# smith: start the focused tests measured over one second before the worlds.
[[profile.default.overrides]]
filter = "package(=smith-agent-shell) & test(=config::tests::native_validated_dense_prompts_fit_the_actual_joint_receiving_ceiling)"
priority = 20

# Every tree: the tests under tests/ first, the longest, then the many short
# unit tests behind them, so that the run ends close to its total over the
# threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = """
(
  (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))
  & (kind(test) & test(/^fuzzy::/))
) | (
  package(/^smith(-|$)/)
  & (kind(test) & test(/^fuzzy::/)) & not binary(/^qa_/) & not binary(=live)
) | (
  package(/^jig(-|$)/)
  & (kind(test) & test(/^fuzzy::/)) & not binary(/^(process|live)$/)
  & not binary(/^browser_/) & not binary(/^qa_/)
) | (
  (package(/^temper(-|$)/) | package(=git-transcripts))
  & ((kind(test) & test(/^fuzzy::/)) | (package(=temper-service) & test(/^tests::sign_in::fuzzy_/)))
  & not binary(/^(process|live|live_github)$/) & not binary(/^qa_/)
)
"""
global-timeout = "480s"
slow-timeout = { period = "40s" }

[[profile.fuzzy.overrides]]
filter = "package(=temper-real-loop-world) & kind(test)"
test-group = "temper-real-loop"

# jig's slow period was ten seconds; the other trees' forty.
[[profile.fuzzy.overrides]]
filter = "package(/^jig(-|$)/)"
slow-timeout = { period = "10s" }

# temper: the walking story's eight shards first, the suite's longest tests.
[[profile.fuzzy.overrides]]
filter = "(package(/^temper(-|$)/) | package(=git-transcripts)) & (test(/^fuzzy_walking_shard_/) | test(/^fuzzy::walking::fuzzy_walking_shard_/))"
priority = 20

[profile.exhaustive-skein]
default-filter = "binary(/^exhaustive_/) & (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))"
global-timeout = "120s"
slow-timeout = { period = "40s" }

[profile.browser-skein]
default-filter = "((package(=skein-browser-world) | package(=skein-ui-web-tests) | package(=skein-lab-browser)) & binary(/^browser_/)) & (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))"
global-timeout = "4m"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1

[profile.live-skein]
default-filter = "(package(=skein-llm-world) & binary(=live)) & (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))"
global-timeout = "20m"
slow-timeout = { period = "120s", terminate-after = 3 }
test-threads = 1
retries = 0
fail-fast = false

[profile.qa-skein]
default-filter = "binary(/^qa_/) & (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))"
global-timeout = "4m"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1

[profile.live-smith]
default-filter = "((package(=smith) | package(=smith-agent-process-world)) & binary(=live)) & package(/^smith(-|$)/)"
global-timeout = "20m"
slow-timeout = { period = "120s" }
test-threads = 1
retries = 0
fail-fast = false

[profile.qa-smith]
default-filter = "binary(/^qa_/) & package(/^smith(-|$)/)"
global-timeout = "120s"
slow-timeout = { period = "6s" }

[profile.qa-jig]
default-filter = "binary(/^qa_/) & package(/^jig(-|$)/)"
global-timeout = "120s"
slow-timeout = { period = "10s" }

[profile.process-jig]
default-filter = "binary(=process) & package(/^jig(-|$)/)"
global-timeout = "4m"
test-threads = 1

[profile.live-jig]
default-filter = "binary(=live) & package(/^jig(-|$)/)"
global-timeout = "24m"
slow-timeout = { period = "10m", terminate-after = 1 }
test-threads = 1
retries = 0

[[profile.live-jig.overrides]]
filter = "test(=a_person_signs_in_to_chatgpt_and_a_real_model_answers)"
slow-timeout = { period = "22m", terminate-after = 1 }

[profile.browser-jig]
default-filter = "(package(=jig-client-browser-world) & binary(/^browser_/)) & package(/^jig(-|$)/)"
global-timeout = "120s"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1

[profile.process-temper]
default-filter = "binary(=process) & (package(/^temper(-|$)/) | package(=git-transcripts))"
global-timeout = "25m"
test-threads = 1

[profile.live-temper]
default-filter = "(binary(=live) | binary(=live_github)) & (package(/^temper(-|$)/) | package(=git-transcripts))"
global-timeout = "50m"
test-threads = 1
retries = 0

[profile.qa-temper]
default-filter = "(binary(/^qa_/) | test(/::qa_/)) & (package(/^temper(-|$)/) | package(=git-transcripts))"
global-timeout = "20m"
test-threads = 1

[[profile.qa-temper.overrides]]
filter = "package(=temper-real-loop-world) & kind(test)"
test-group = "temper-real-loop"

[profile.browser-temper]
default-filter = "(package(=temper-client-browser-world) & binary(/^browser_/)) & (package(/^temper(-|$)/) | package(=git-transcripts))"
global-timeout = "120s"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1
