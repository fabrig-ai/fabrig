# The workspace's focused, fuzzy, and tier profiles.
#
# The focused suite, profile default, is each tree's focused suite: every test
# but the fuzzy ones and the tiers' binaries (process, live, browser).
# The fuzzy suite, profile fuzzy,
# is each tree's fuzzy suite: the `fuzzy` module
# of a package's `suite` binary. Each tree's filter is its own, restricted to the
# packages under its directory (cargo metadata), joined with |.
#
#   skein:  package(/^skein-/), and forgejo-conformance, github-conformance
#   smith:  package(/^smith(-|$)/)
#   jig:    package(/^jig(-|$)/)
#   temper: package(/^temper(-|$)/)
#   hearth: package(/^hearth(-|$)/)
#
# and the repository's own checks, under tests/ at the root:
#
#   fabrig: package(=fabrig-boundary)
#
# The tier profiles are browser-skein, live-skein; live-smith; live-jig,
# browser-jig; process-temper, live-temper, browser-temper; and
# conformance-hearth. Each keeps its tree's
# own budget.
#
# Each tree's budget was 30 s focused and 120 s fuzzy, doubled provisionally
# at the user's request on 10-22; the workspace's is their sum, until the
# suites are timed together. Slow periods only flag a test SLOW as it runs
# (none terminates); each tree keeps its own.

# CPU contention inflates real-loop work without runnable wait, which
# skein/docs/foundation/testing-strategy.md 2.10's starvation rule cannot see.
[test-groups]
temper-real-loop = { max-threads = 2 }
# ChatGPT's registered loopback callback must listen on fixed port 1455.
temper-sign-in-callback = { max-threads = 1 }

[profile.default]
# The temper block keeps the drivers' helpers focused and excludes their offline
# process proofs (temper/docs/design/testing/process-tier.md).
default-filter = """
(
  (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))
  & not (kind(test) & test(/^fuzzy::/)) & not binary(/^browser_/) & not binary(=live)
) | (
  package(/^smith(-|$)/)
  & not (kind(test) & test(/^fuzzy::/))
  & not ((package(=smith) | package(=smith-agent-process-world)) & binary(=live))
) | (
  package(/^jig(-|$)/)
  & not (kind(test) & test(/^fuzzy::/))
  & (not binary(=live) | test(=the_live_configurations_are_ones_jig_test_reads)
     | test(=live_sign_in::tests::a_refused_plan_is_reported_with_the_run_failure))
  & not binary(/^browser_/)
) | (
  package(/^temper(-|$)/)
  & not test(/^tests::sign_in::fuzzy_/) & not ((kind(test) | package(=temper-engine-domain)) & test(/^fuzzy::/))
  & not (package(=temper-engine-domain-forge) & kind(lib) & test(/^fuzzy::/))
  & not binary(/^(process|live|live_github)$/)
  & not (binary(=proof_live) & test(/^rung_b0s_/))
  & not (binary(=live_github_managed) & test(=managed_ready_client))
  & not binary(/^browser_/)
) | (
  package(/^hearth(-|$)/) & not (kind(test) & test(/^fuzzy::/))
  & not binary(/^(conformance|recorded)_/)
) | package(=fabrig-boundary)
"""
global-timeout = "150s"
slow-timeout = { period = "6s" }

[[profile.default.overrides]]
filter = "package(=temper-real-loop-world) & kind(test)"
test-group = "temper-real-loop"

# jig's and hearth's slow periods were one second; the other trees' six.
[[profile.default.overrides]]
filter = "package(/^jig(-|$)/) | package(/^hearth(-|$)/)"
slow-timeout = { period = "1000ms" }

# smith: start the focused tests measured over one second before the worlds.
[[profile.default.overrides]]
filter = "package(=smith-agent-shell) & test(=config::tests::native_validated_dense_prompts_fit_the_seen_joint_receiving_ceiling)"
priority = 20

# Every tree: the tests under tests/ first, the longest, then the many short
# unit tests behind them, so that the run ends close to its total over the
# threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = """
(
  (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))
  & (kind(test) & test(/^fuzzy::/))
) | (
  package(/^smith(-|$)/)
  & (kind(test) & test(/^fuzzy::/)) & not binary(=live)
) | (
  package(/^jig(-|$)/)
  & (kind(test) & test(/^fuzzy::/)) & not binary(=live)
  & not binary(/^browser_/)
) | (
  package(/^temper(-|$)/)
  & (((kind(test) | package(=temper-engine-domain)) & test(/^fuzzy::/))
     | (package(=temper-engine-domain-forge) & kind(lib) & test(/^fuzzy::/))
     | (package(=temper-service) & test(/^tests::sign_in::fuzzy_/)))
  & not binary(/^(process|live|live_github)$/)
) | (
  package(/^hearth(-|$)/) & (kind(test) & test(/^fuzzy::/))
)
"""
global-timeout = "600s"
slow-timeout = { period = "40s" }

[[profile.fuzzy.overrides]]
filter = "package(=temper-real-loop-world) & kind(test)"
test-group = "temper-real-loop"

# jig's and hearth's slow periods were ten seconds; the other trees' forty.
[[profile.fuzzy.overrides]]
filter = "package(/^jig(-|$)/) | package(/^hearth(-|$)/)"
slow-timeout = { period = "10s" }

[profile.browser-skein]
default-filter = "((package(=skein-browser-world) | package(=skein-ui-web-tests)) & binary(/^browser_/)) & (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))"
global-timeout = "4m"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1

[profile.live-skein]
default-filter = "(package(=skein-llm-world) & binary(=live)) & (package(/^skein-/) | package(=forgejo-conformance) | package(=github-conformance))"
global-timeout = "20m"
slow-timeout = { period = "120s", terminate-after = 3 }
test-threads = 1
retries = 0
fail-fast = false

[profile.live-smith]
default-filter = "((package(=smith) | package(=smith-agent-process-world)) & binary(=live)) & package(/^smith(-|$)/)"
global-timeout = "20m"
slow-timeout = { period = "120s" }
test-threads = 1
retries = 0
fail-fast = false

[profile.live-jig]
default-filter = "binary(=live) & not test(=live_sign_in::tests::a_refused_plan_is_reported_with_the_run_failure) & package(/^jig(-|$)/)"
global-timeout = "24m"
slow-timeout = { period = "10m", terminate-after = 1 }
test-threads = 1
retries = 0

[[profile.live-jig.overrides]]
filter = "test(=a_person_signs_in_to_chatgpt_and_a_real_model_answers)"
slow-timeout = { period = "22m", terminate-after = 1 }

[profile.browser-jig]
default-filter = "(package(=jig-client-browser-world) & binary(/^browser_/)) & package(/^jig(-|$)/)"
global-timeout = "120s"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1

# Process stories and the two drivers' offline proofs, three at a time
# (temper/docs/design/testing/process-tier.md).
[profile.process-temper]
default-filter = "(binary(=process) | (binary(=proof_live) & test(/^rung_b0s_/)) | (binary(=live_github_managed) & test(=managed_ready_client))) & package(/^temper(-|$)/)"
global-timeout = "25m"
test-threads = 3

# The one walk that signs in to ChatGPT on the fake box, where the callback's port is fixed.
[[profile.process-temper.overrides]]
filter = "package(=temper-box) & binary(=process) & test(=fake_backends::walk::sign_in::a_chatgpt_browser_tab_on_the_fake_box_leaves_ready_able_to_create)"
test-group = "temper-sign-in-callback"

# The after-landing tier, under --run-ignored only: the owned-forge landing pair on the
# Anthropic key and Claude Code login the tier takes as inputs (temper/docs/design/testing/live-tier.md). The owner's
# scripts ignore this filter and name their own story.
[profile.live-temper]
default-filter = "(binary(=live) & (test(=a_person_asks_claude_on_an_api_key_to_land_a_change_on_the_owned_forge) | test(=a_person_asks_claude_code_to_land_a_change_on_the_owned_forge))) & package(/^temper(-|$)/)"
global-timeout = "50m"
test-threads = 1
retries = 0

[profile.browser-temper]
default-filter = "(package(=temper-client-browser-world) & binary(/^browser_/)) & package(/^temper(-|$)/)"
global-timeout = "120s"
slow-timeout = { period = "40s" }
test-threads = 1

# The conformance tier, outside the gate (hearth/docs/design/testing/README.md, 2.8);
# HEARTH_RECORD=1 captures.
[profile.conformance-hearth]
default-filter = "(binary(/^conformance_/) | binary(/^recorded_/)) & package(/^hearth(-|$)/)"
global-timeout = "4m"
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 0
fail-fast = false
