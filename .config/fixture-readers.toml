# Fixture readers: skein/docs/foundation/testing-strategy.md, 8.
# Contract and schema: tools/tiers/design.md, 9 (Fixture readers).
# Repository-relative globs cover each tracked fixture exactly once, except
# generator scripts, which are named only by regenerate arrays.
# Entries declare readers or an explicit provenance disposition and reason.
# Provenance is restricted to README.md and capture meta.json files.
# Reader filters may conservatively include other tests of a shared helper.
