# Fixture readers: skein/docs/foundation/testing-strategy.md, 8.
# Contract and schema: tools/tiers/design.md, 9 (Fixture readers).
# Paths are repository-relative globs; every tracked **/fixtures/** file
# matches exactly one fixture entry, even across multiple paths in that entry.
# Reader filters may conservatively include other tests of a shared helper.
# An empty readers list means no nextest reader was found; comments name
# known manual or non-nextest consumers. Regeneration is never automatic.

