[package]
license.workspace = true
name = "smith-bench"
description = "Offline checks and real-provider measurements of agent tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "smith-bench"

[[bin]]
name = "smith-bench"
path = "src/main.rs"
test = false

[[bin]]
name = "test-peer"
path = "src/bin/test_peer.rs"
test = false

[dependencies]
skein-fail-stop.workspace = true
serde = { workspace = true }
serde_path_to_error.workspace = true
serde_json = { workspace = true }
sha2.workspace = true
toml.workspace = true
regex.workspace = true
base64.workspace = true
time = { workspace = true }
smith-local-shell = { path = "../crates/smith-local-shell" }
smith-events.workspace = true
skein-lib.workspace = true
skein-llm.workspace = true
skein-world.workspace = true
skein-io.workspace = true
skein-shell.workspace = true
skein-oauth.workspace = true

[dev-dependencies]
smith-events-fixtures.workspace = true
smith-bench-fixtures.workspace = true
skein-scratch.workspace = true
smith-agent-service.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
