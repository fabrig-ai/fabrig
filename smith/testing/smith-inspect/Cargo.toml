[package]
name = "smith-inspect"
description = "Quiet-point inspections of smith's waits, tables and reserved room"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
skein-lib.workspace = true
skein-world.workspace = true
smith-domain.workspace = true
smith-domain-session.workspace = true
smith-domain-tools.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
