[package]
license.workspace = true
name = "smith-protocol-events-fixtures"
description = "Shared test fixtures for smith-protocol-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
smith-protocol-events.workspace = true
smith-events.workspace = true
smith-events-fixtures.workspace = true
smith-domain.workspace = true
skein-lib.workspace = true
skein-io.workspace = true

[lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
