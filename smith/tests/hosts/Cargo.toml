[package]
license.workspace = true
name = "smith-hosts-world"
description = "A host service spawning Smith's agent over a simulated process tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
smith-fake-claude.workspace = true
smith-protocol-program.workspace = true
skein-heap.workspace = true
skein-fake-llm-domain.workspace = true
smith-local-shell.workspace = true
smith-local-process-world.workspace = true
serde_json = "1"
skein-shell.workspace = true
skein-fake-peers.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-sim.workspace = true
skein-fake-machine.workspace = true
skein-world.workspace = true
skein-tls-world.workspace = true
smith-agent-service.workspace = true
smith-local-service.workspace = true
smith-agent-shell.workspace = true
smith-agent-process-world.workspace = true
smith-host-domain.workspace = true
smith-host-protocol = { workspace = true, features = ["fixture"] }
smith-channel.workspace = true
smith-protocol-channel.workspace = true
smith-charter.workspace = true

[lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
unused_qualifications = "warn"

[lints.clippy]
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
single_match_else = "allow"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
impl_trait_in_params = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
allow_attributes = "deny"
match_wildcard_for_single_variants = "deny"
enum_glob_use = "deny"
wildcard_imports = "deny"
panic = "deny"
missing_assert_message = "deny"
assertions_on_result_states = "deny"
unused_result_ok = "deny"
let_underscore_untyped = "deny"
mixed_read_write_in_expression = "deny"
infinite_loop = "deny"
empty_drop = "deny"
exit = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"
host_endian_bytes = "deny"
fn_to_numeric_cast_any = "deny"
default_numeric_fallback = "deny"
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"
alloc_instead_of_core = "deny"
partial_pub_fields = "deny"
mod_module_files = "deny"
tests_outside_test_module = "deny"
iter_over_hash_type = "deny"

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lib]
test = false
doctest = false
