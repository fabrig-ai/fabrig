name: Goal pre-PR
on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Goal pull request number
        required: true
      goal_head:
        description: Goal commit at the observed event
        required: true
      destination:
        description: Destination commit at the observed event
        required: true
permissions:
  contents: read
jobs:
  goal:
    uses: ./.forgejo/workflows/ci.yml
    with:
      pull_number: ${{ github.event.inputs.pull_number }}
      goal_head: ${{ github.event.inputs.goal_head }}
      destination: ${{ github.event.inputs.destination }}
