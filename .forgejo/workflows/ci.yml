name: Full goal pre-PR
on:
  workflow_call:
    inputs:
      goal_head:
        type: string
        required: true
      destination:
        type: string
        required: true
      pull_number:
        type: string
        required: true
jobs:
  check:
    runs-on: goal-pre-pr
    permissions:
      contents: read
    steps:
      - name: Check the goal against its destination
        env:
          GOAL_HEAD: ${{ inputs.goal_head }}
          DESTINATION: ${{ inputs.destination }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          status=0
          "$HOME/.local/bin/full-goal-pre-pr" "$PULL_NUMBER" "$GOAL_HEAD" "$DESTINATION" || status=$?
          case "$status" in
            0|1) exit "$status" ;;
            *) echo "Full goal pre-PR unavailable (runner status $status). No check verdict." ;;
          esac
