name: Full goal pre-PR
on:
  workflow_call:
    inputs:
      goal_head:
        type: string
        required: true
      destination:
        type: string
        required: true
      pull_number:
        type: string
        required: true
jobs:
  check:
    runs-on: dogfood
    permissions:
      contents: read
    steps:
      - name: Check the goal against its destination
        env:
          GOAL_HEAD: ${{ inputs.goal_head }}
          DESTINATION: ${{ inputs.destination }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          if [ -x "$HOME/.local/bin/full-goal-pre-pr" ]; then
            "$HOME/.local/bin/full-goal-pre-pr" "$PULL_NUMBER" "$GOAL_HEAD" "$DESTINATION"
          else
            echo "Full goal pre-PR unavailable on this runner" >&2
            exit 78
          fi
