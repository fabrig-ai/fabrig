name: Tier macos-suites
# The macOS suites tier, dispatched by temper through the relay.
# See temper/docs/design/testing/macos.md, section 9.
on:
  workflow_dispatch:
    inputs:
      temper_commit:
        required: true
      temper_key:
        required: true
      temper_tests:
        required: false
        default: ""
jobs:
  tier:
    runs-on: relay
    timeout-minutes: 330
    steps:
      - run: '"$CI_TIER" --tier macos-suites "${{ inputs.temper_commit }}"'
        env:
          CI_TIER_TESTS: ${{ inputs.temper_tests }}
          CI_TIER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: junit
          path: junit.xml
