name: Gate
# The landing's gate under `by: turn`: dispatched by temper alone, at a
# landing's candidate, with the round's base. What it runs is the runner
# host's `$CI_GATE`, the same as ci.yml's. temper also dispatches it at a
# search's probes, with `temper_probe` `yes`, given to `$CI_GATE` as
# `CI_GATE_PROBE` so that it may stop at its first red. `temper_tests`,
# given as `CI_GATE_TESTS`, selects cases; failed-tests lists the failed ids.
on:
  workflow_dispatch:
    inputs:
      temper_commit:
        required: true
      temper_key:
        required: true
      temper_base:
        required: false
        default: ""
      temper_probe:
        required: false
        default: ""
      temper_tests:
        required: false
        default: ""
jobs:
  gate:
    runs-on: dogfood
    steps:
      - name: Load gate reporter
        env:
          BASE: ${{ inputs.temper_base }}
          CI_GATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I - <<'PYTHON'
          import os, pathlib, re, urllib.request
          env = os.environ
          ref = env.get('BASE') or 'main'
          if ref != 'main' and not re.fullmatch('[0-9a-f]{40}|[0-9a-f]{64}', ref):
              raise ValueError("invalid landing base")
          url = f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/raw/.forgejo/scripts/gate_log.py?ref={ref}"
          request = urllib.request.Request(url, headers={"Authorization": "token " + env["CI_GATE_TOKEN"]})
          with urllib.request.urlopen(request, timeout=30) as response:
              pathlib.Path("gate-reporter.py").write_bytes(response.read())
          PYTHON
      - name: Gate
        run: |
          gate_status=0
          python3 -I -B gate-reporter.py bash -e -o pipefail <<'GATE' || gate_status=$?
          if [ -z "$BASE" ]; then exec "$CI_GATE" "$CANDIDATE" "$BASE"; fi
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          work="$tmp/candidate"
          policy="$tmp/landed"
          mkdir "$policy"
          remote=${CI_GATE_REMOTE:-http://127.0.0.1:3000/$GITHUB_REPOSITORY.git}
          git init -q "$work"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: token $CI_GATE_TOKEN" \
            git -C "$work" fetch -q --no-tags --depth=1 "$remote" "$BASE" "$CANDIDATE"
          git -C "$work" checkout -q --detach "$CANDIDATE"
          if git -C "$work" cat-file -e "$BASE:.forgejo/scripts/gate_route.sh" 2>/dev/null; then
            for file in gate_route.sh gate_scope.py gate_validate.py test_gate_routes.py test_gate_log.py; do
              git -C "$work" show "$BASE:.forgejo/scripts/$file" > "$policy/$file"
            done
            sh "$policy/gate_route.sh" env -u CI_GATE_TOKEN python3 -I -B "$policy/gate_scope.py" "$work" "$BASE" "$CANDIDATE"
          else
            # The first landing that introduces the policy exercises the regular Gate.
            "$CI_GATE" "$CANDIDATE" "$BASE"
          fi
          GATE
          if [ "$gate_status" -ne 0 ] && [ -s gate-result.txt ]; then
            cat gate-result.txt
          fi
          exit "$gate_status"
        env:
          CI_GATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ inputs.temper_commit }}
          BASE: ${{ inputs.temper_base }}
          CI_GATE_PROBE: ${{ inputs.temper_probe }}
          CI_GATE_TESTS: ${{ inputs.temper_tests }}
      - name: Save JUnit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: junit
          path: junit.xml
      - name: Save failed test IDs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: failed-tests
          path: failed-tests.txt
      - name: Save gate diagnostics
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: gate-diagnostics
          path: gate-diagnostics.log
      - name: Gate result
        if: always()
        run: |
          if [ -s gate-result.txt ]; then cat gate-result.txt
          else echo 'Gate result unavailable. See the first failed step.'; fi
