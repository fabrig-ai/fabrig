[package]
name = "skein-conformance-real"
description = "The conformance suite against both backends on the real kernel, each scenario once"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-fail-stop.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true
skein-conformance.workspace = true
skein-scratch.workspace = true
skein-world.workspace = true
libc.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[lib]
test = false
doctest = false

[[bin]]
name = "process_fixture"
test = false

[[bin]]
name = "signal_sender_fixture"
test = false

[[bin]]
name = "inherit_fixture"
test = false
