[package]
name = "skein-tls-world"
description = "The TLS client's machine worlds: in-memory handshakes and exchanges against a rustls server, its worst case against the counting allocator, and the HTTP client stacked on it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-tls-kit.workspace = true
skein-lib.workspace = true
skein-protocol-kit.workspace = true
skein-tls.workspace = true
# Native ciphertext-output composition uses IO on the simulator.
skein-io.workspace = true
skein-sim.workspace = true

[dev-dependencies]
# The counting allocator, shared by the memory worlds.
skein-heap.workspace = true
skein-world.workspace = true
skein-fake-peers.workspace = true
skein-fake-llm-domain.workspace = true
skein-fake-llm-protocol.workspace = true
skein-llm.workspace = true
skein-llm-kit.workspace = true
# The HTTP client, stacked on the TLS client in tests/stack.rs.
skein-http.workspace = true
skein-shell.workspace = true
skein-scratch.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# The server: rustls's buffered connection, over std's readers and writers.
rustls-std = { workspace = true }

# tests/clippy.toml bans what would make a run unrepeatable; what rustls draws
# from the kernel makes it so anyway (net/tls.md, 5).
[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[lib]
test = false
doctest = false
