[package]
name = "skein-http-world"
description = "The machine worlds of the HTTP client and server and of the server-sent events reader and writer: transcripts, generated and mutated responses, requests and streams, reference readers, and the client and the reader stacked with JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
skein-http-kit.workspace = true
skein-protocol-kit.workspace = true
skein-scratch.workspace = true
skein-lib.workspace = true
skein-http.workspace = true
skein-json.workspace = true

[dev-dependencies]
# The counting allocator, for tests/memory.rs only.
skein-heap.workspace = true
# The JSON reference parser, which the stacked test checks each event's
# document against.
skein-json-world = { path = "../json" }

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
