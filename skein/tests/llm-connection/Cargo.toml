[package]
name = "skein-llm-connection-world"
description = "Plaintext replay and TLS handshake worlds for the connection component"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
skein-lib.workspace = true
skein-io.workspace = true
skein-llm.workspace = true
skein-llm-connection.workspace = true
skein-tls.workspace = true
skein-llm-kit.workspace = true
skein-tls-world = { path = "../tls" }
skein-fake-peers.workspace = true
skein-fake-llm-domain.workspace = true
skein-fake-llm-protocol.workspace = true
skein-sim.workspace = true
skein-world.workspace = true

[dev-dependencies]
skein-heap.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
