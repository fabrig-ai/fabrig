[package]
name = "skein-ui-web-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-fail-stop.workspace = true
skein-browser.workspace = true
skein-fake-person-browser.workspace = true
skein-fake-person.workspace = true
skein-ui.workspace = true
skein-ui-web.workspace = true
skein-ui-bundle.workspace = true
skein-ui-example-view.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-world.workspace = true
skein-fake-peers.workspace = true
skein-http.workspace = true
skein-scratch.workspace = true

[dev-dependencies]
skein-ui-example-server.workspace = true
flate2.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[lib]
test = false
doctest = false

[[bin]]
name = "harness_fixture"
path = "src/bin/harness_fixture.rs"
test = false
