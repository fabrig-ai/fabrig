[package]
name = "github-conformance"
description = "GitHub dialect conformance against the hosted fake and owner fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
[dependencies]
skein-forge-connection.workspace = true
skein-fail-stop.workspace = true
skein-forge-conformance.workspace = true
skein-forge.workspace = true
skein-fake-forge-domain.workspace = true
skein-fake-forge-github.workspace = true
skein-fake-peers.workspace = true
skein-sim.workspace = true
skein-shell.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-http.workspace = true
skein-json.workspace = true
skein-tls.workspace = true
[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[dev-dependencies]
skein-scratch.workspace = true
