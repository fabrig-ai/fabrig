[package]
# The shipped-binary test is registered by examples/echo/shell.
autotests = false
name = "skein-echo-world"
description = "The echo's simulated worlds and its real loop: the echo and fake clients as processes, a referee beside them, under tiny limits and every fault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-io.workspace = true
skein-sim.workspace = true
skein-heap.workspace = true
skein-world.workspace = true
skein-echo-service.workspace = true
skein-echo-shell = { path = "../../examples/echo/shell" }
skein-echo-client.workspace = true

# The clock, for tests/real.rs.
[dev-dependencies]
skein-scratch.workspace = true
skein-shell.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[lib]
test = false
doctest = false

[[test]]
name = "suite"
path = "tests/suite/main.rs"
