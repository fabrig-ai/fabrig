[package]
name = "skein-json-world"
description = "The JSON tokenizer's machine worlds and the writer against it: transcripts, generated and mutated documents, a reference parser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
skein-json-kit.workspace = true
skein-protocol-kit.workspace = true
skein-scratch.workspace = true
skein-lib.workspace = true
skein-json.workspace = true

# The counting allocator, for tests/memory.rs only.
[dev-dependencies]
skein-heap.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
