[package]
name = "skein-echo-shell"
description = "The echo example's main: its configuration, startup, and the loop over the shell kit's kernel and clock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "skein-echo"
path = "src/main.rs"

[dependencies]
skein-fail-stop.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true
skein-echo-service.workspace = true

[lints.rust] # ring: tools/lints/design.md, 2.4
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
dbg_macro = "deny"
missing_assert_message = "deny"
iter_over_hash_type = "deny"

[dev-dependencies]
skein-scratch.workspace = true
skein-world.workspace = true
skein-echo-client.workspace = true
