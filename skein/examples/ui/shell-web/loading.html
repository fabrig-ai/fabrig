<div id="boot"
 data-figure="{got} of {total} MB" data-left=" · about {left} left"
 data-seconds="{n} s" data-minutes="{n} min"
 data-keeps="Your browser keeps these notes ready for next time."
 data-waiting="Waiting for the server…" data-starting="Starting notes…"
 data-failed="Notes did not load."
 data-dropped="The connection dropped at {got} of {total} MB."
