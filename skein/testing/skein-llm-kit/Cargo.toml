[package]
name = "skein-llm-kit"
description = "The LLM world's wire fixtures and its faces of skein's fake LLM"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
skein-lib.workspace = true
skein-http.workspace = true
skein-json.workspace = true
skein-llm.workspace = true
skein-fake-llm-domain.workspace = true
skein-fake-llm-protocol.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
