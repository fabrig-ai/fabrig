[[question]]
id = "mechanism-deadline-required"
parts = ["world-surfaces"]
text = """Host::next_mechanism_deadline lands provided, defaulting to None, so that the 146 Host impls in skein, smith, jig and temper compile unchanged; skein's hosts move onto it in this run. A required method would make a host that forgets io's close and retry deadlines fail to build instead of sleeping past them, but it changes a public interface every tree implements (AGENTS.md, 7). Options: (a) keep it provided with the None default; (b) make it required in a later run that moves every tree's hosts at once; (c) make it required now, with this run's tasks editing smith, jig and temper. Recommendation: (b): the run stays inside skein, and the later run is mechanical once skein's hosts show the shape."""

[[question]]
id = "component-kit-role"
parts = ["kit-contract"]
text = """The draft's 6.2: a component-kit role in programming-model.md, 4, changes the code's rules, so it is the user's; this plan proposes it and lands nothing. Proposed wording, a row after lib in the role table: "component kit: shared mechanism a component holds by value or calls as free functions, concrete step pieces with no trait, no generic item and no dyn (10); it depends on lib and io only, and no component's private copy of what it holds survives its landing. Its members today: skein_io::stage; later the shared transport." Options: (a) land the row as worded, in a docs task after this run; (b) land it with the shared transport's run, when the kit has its second member; (c) no role: kit items live in lib or io by fit, as this run places them. Recommendation: (b): one member is not yet a tier, and the stage fits io's own role today."""
