ready = false

# The thin cut of skein's component kit, phase 1
# (skein/docs/design/draft/component-kit.md). Every part is direct; its
# tasks are in tasks/, their shared rules in notes/, the cut's choices in
# notes/decisions.md.
draft = "component-kit"
repo = "fabrig"
sources = [
  "skein/docs/design/draft/component-kit.md",
  "skein/docs/plan/component-kit/inputs/kickoff.md",
  "skein/docs/plan/component-kit/inputs/skein-quality-review.md",
  "skein/docs/plan/component-kit/inputs/brief.md",
  "skein/docs/plan/component-kit/inputs/README.md",
  "AGENTS.md",
  "agents/lead.md",
  "agents/implementer.md",
  "agents/operations.md",
]

[buffer]
low = 1.0
high = 2.0

# The counts, then lib's primitives and io's stage, landed before any site
# moves (draft, 3.1 and 4).

[[part]]
id = "kit-contract"
title = "The counts, lib's missing primitives and skein_io::stage::{up, down}"
mode = "direct"
needs = []
design = "skein/docs/design/draft/component-kit.md, 3.1 and 4"

# Referee defaults, a provided Host::next_deadline and a forwarding Host
# (draft, 3.5). Its shell-surfaces task is read by the stage sites.

[[part]]
id = "world-surfaces"
title = "Referee defaults, a provided Host::next_deadline, a forwarding Host"
mode = "direct"
needs = ["kit-contract"]
design = "skein/docs/design/draft/component-kit.md, 3.5"

[[part]]
id = "echo-first"
title = "The echo example's host on the shared stage"
mode = "direct"
needs = ["kit-contract", "world-surfaces"]
design = "skein/docs/design/draft/component-kit.md, 3.2"

[[part]]
id = "stage-sites"
title = "The other io stage sites on skein_io::stage, one crate family per task"
mode = "direct"
needs = ["kit-contract", "world-surfaces", "echo-first"]
design = "skein/docs/design/draft/component-kit.md, 3.3"

[[part]]
id = "abort"
title = "Abort in skein-forge-connection and skein-forge-setup's host"
mode = "direct"
needs = ["kit-contract"]
design = "skein/docs/design/draft/component-kit.md, 3.6"

[[part]]
id = "lib-sites"
title = "The private copies of lib's primitives on lib, one crate family per task"
mode = "direct"
needs = ["kit-contract", "abort"]
design = "skein/docs/design/draft/component-kit.md, 3.4"

[[slice]]
id = 1
story = "The echo example's host runs on lib's and io's shared items, its story test green"
parts = ["kit-contract", "echo-first"]
walk = false

[[slice]]
id = 2
story = "Every io stage site and every private copy of lib's primitives is on the shared items, the counts at their targets"
parts = ["stage-sites", "lib-sites"]
walk = false

[[slice]]
id = 3
story = "Test worlds take the referee and host defaults and forward Host once; both forge components take Abort"
parts = ["world-surfaces", "abort"]
walk = false

[[question]]
id = "component-kit-role"
text = "A component-kit role in skein/docs/foundation/programming-model.md, 4 (draft, 6.2): shared mechanism between lib and the components changes the code's rules. Land the wording proposed in skein/docs/plan/component-kit/notes/decisions.md (6.2), change it, or leave the model as it is? Recommended: land it, so the shared transport has a place. Nothing in this run waits for it."
parts = []
