sources = ["skein/docs/plan/json-strings/inputs/request.md", "skein/crates/skein-json/src/writer.rs", "skein/crates/skein-json/src/string.rs", "skein/crates/skein-json/src/utf8.rs", "AGENTS.md", "DESIGN.md"]

# Two tasks, writer then decode: both are in skein-json, and decode builds on
# what writer creates. Decode merges on its own, so that a red points at it. See plan.md.

[buffer]
low = 1.0
high = 2.0

[[part]]
id = "writer"
title = "The writing pass stops measuring, and a plain run costs no call per byte in the writer"
mode = "direct"
needs = []
design = "skein/docs/design/json.md, 4"

[[part]]
id = "decode"
title = "decode takes a plain run at once, its contract exact"
mode = "direct"
needs = ["writer"]
design = "skein/docs/design/json.md, 3.4"

[[slice]]
id = 1
story = "a string is written with one pass over its text, its plain runs measured and written with no call per byte, the same bytes and refusals"
parts = ["writer"]
walk = false

[[slice]]
id = 2
story = "a string is read with its plain runs taken at once, the same tokens, errors and positions however the bytes were cut"
parts = ["decode"]
walk = false
