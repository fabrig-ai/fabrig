draft = "kv-chunk-target"
repo = "fabrig"
sources = ["skein/docs/plan/kv-chunk-target/inputs/request.md", "AGENTS.md"]

# A snapshot chunk packs to a small target and Limits::chunk is its ceiling
# (skein/docs/design/kv.md, 3, 5, 7 and 9; inputs/request.md). Released in batches: first the
# packing, which needs nothing, then recovery's reads and the status.

[buffer]
low = 1.0
high = 2.0

[[part]]
id = "pack"
title = "skein-kv: a snapshot chunk packs to the target, and grows only to hold one row"
mode = "direct"
needs = []
design = "skein/docs/design/kv.md, 5"

[[slice]]
id = 1
story = "many small rows under a large chunk are written in chunks of about the target, and a snapshot's step stays near it"
parts = ["pack"]
walk = false

[[part]]
id = "read"
title = "skein-kv: recovery reads the target, and any chunk up to the ceiling"
mode = "direct"
needs = ["pack"]
design = "skein/docs/design/kv.md, 3"

[[part]]
id = "status"
title = "skein: kv's status, once a chunk packs to the target"
mode = "direct"
needs = ["pack", "read"]
design = "skein/docs/design/kv.md, 7"

[[slice]]
id = 2
story = "a restart under a large chunk holds reads of the target and its largest chunk or frame; a store packed to its ceiling still opens"
parts = ["read"]
walk = false

[[slice]]
id = 3
story = "kv's status says what still lags, its bounds in the target and the largest row held"
parts = ["status"]
walk = false
