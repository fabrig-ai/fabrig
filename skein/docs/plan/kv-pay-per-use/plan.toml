draft = "kv-pay-per-use"
repo = "fabrig"
sources = ["skein/docs/plan/kv-pay-per-use/inputs/request.md", "AGENTS.md"]

# skein-kv pays for what it holds (skein/docs/design/kv.md, 1, 3, 5, 7 and 9): an open's
# reads sized by its files, a snapshot's trigger by the live map with snapshot_after a
# ceiling, recovery a chunk and a frame at a time, and restarts that count what they replay.
# Released in batches: first the two tasks that need nothing (the reads, the bound), then
# the recovery tasks built on them and the status.

[buffer]
low = 1.0
high = 2.0

[[part]]
id = "open-reads"
title = "skein-kv: an open reads what its files hold, not a chunk per read"
mode = "direct"
needs = []
design = "skein/docs/design/kv.md, 3"

[[part]]
id = "snapshot-bound"
title = "skein-kv: a snapshot's trigger follows the live map, snapshot_after a ceiling"
mode = "direct"
needs = []
design = "skein/docs/design/kv.md, 5"

[[slice]]
id = 1
story = "a small store under a large chunk opens with reads totalling its own files' bytes"
parts = ["open-reads"]
walk = false

[[slice]]
id = 2
story = "a store whose map churns in place keeps its log within twice its map, or 64 KiB, far below snapshot_after"
parts = ["snapshot-bound"]
walk = false
