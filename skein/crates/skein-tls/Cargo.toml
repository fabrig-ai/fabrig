[package]
name = "skein-tls"
description = "A TLS client stream for a connection's stack of protocol machines, over rustls's unbuffered connection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
rustls.workspace = true
ring.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { workspace = true, features = ["web"] }

[lints]
workspace = true

[dev-dependencies]
skein-rows.workspace = true
