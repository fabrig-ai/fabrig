[package]
name = "skein-ui-web"
description = "Portable browser parts for semantic user interfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-ui.workspace = true
skein-lib.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["CssStyleDeclaration", "Document", "Element", "Node", "NodeList", "Text", "HtmlCollection", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlOptionElement", "HtmlOptionsCollection", "HtmlTextAreaElement", "HtmlDialogElement", "Event", "EventTarget", "MouseEvent", "WheelEvent", "KeyboardEvent", "InputEvent", "ResizeObserver", "ResizeObserverEntry", "DomRect", "DomRectReadOnly", "Window", "Request", "RequestInit", "RequestCredentials", "RequestCache", "RequestMode", "Response", "AbortController", "AbortSignal", "Headers", "Navigator", "Performance", "Crypto", "ReadableStream", "ReadableStreamDefaultReader", "Storage", "Location", "History", "PopStateEvent", "BeforeUnloadEvent", "ScrollRestoration", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "HtmlScriptElement"] }


[lints.rust] # binary: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
