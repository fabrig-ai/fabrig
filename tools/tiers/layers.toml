"smith-local-world::suite" = "system" # step + system: referee controls and local host with real agent domains.
"smith-machine-world::suite" = "real-loop" # step + simulated + real-loop: fixtures also use real file io, jobs and synchronous rg children.
"smith-protocol-llm-world::suite" = "protocol" # step + protocol: codec/referee controls and composed LLM peers.
"smith-real-world::suite" = "real-loop"
"smith-run-world::suite" = "domain" # step + domain: direct memory fixtures and run stories.
"smith-session-world::suite" = "domain" # step + domain: prefix-referee controls and session stories.
"smith-tools-world::suite" = "domain" # step + domain: direct memory fixtures and tools stories.
"smith::end_to_end" = "end-to-end"
"smith::live" = "end-to-end"
"smith::live_configuration" = "end-to-end" # step + end-to-end: offline controls and the shipped smith check.

