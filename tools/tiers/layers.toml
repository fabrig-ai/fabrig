# Each test binary's layer (tools/tiers/layers.md). A library's own tests, a binary's own and a
# crate's generated codec tests are step tests, and the repository's checks a group of their own,
# by rule, with no line.
layers = ["step", "domain", "system", "machine", "protocol", "io", "simulated", "real-loop", "end-to-end"]

[skein]

[smith]
"smith-agent-process-world::live" = "end-to-end" # Real program processes and provider, not the simulated service.
"smith-agent-process-world::live_input" = "simulated"
"smith-agent-process-world::live_text" = "simulated"
"smith-agent-process-world::suite" = "simulated" # step + simulated: profile derivations and whole agent service.
"smith-agent-service::suite" = "step"
"smith-agent-shell::suite" = "step"
"smith-agent-world::suite" = "domain" # step + domain: referee controls and agent stories.
"smith-bench::suite" = "end-to-end" # step + end-to-end: offline harness checks and replay command processes.
"smith-channel-world::live" = "protocol"
"smith-channel-world::suite" = "protocol" # step + protocol: referee controls and both channel halves.
"smith-codecs-world::suite" = "step"
"smith-fake-claude::suite" = "end-to-end" # step + simulated + end-to-end: encodings, hosted fake and executable.
"smith-host-world::suite" = "domain" # step + domain: parent-referee controls and host stories.
"smith-hosts-world::suite" = "simulated" # step + simulated: referee controls and host spawning an agent.
"smith-local-process-world::suite" = "simulated" # step + simulated: configuration controls and whole local service.
