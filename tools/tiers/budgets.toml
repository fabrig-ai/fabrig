# The user's budgets, director/decisions/0028 (10-30): x1.5 of the cold measurement of 10-30 (main 44230b8fc), process-temper at its design aim (temper/docs/design/testing/process-tier.md), red until its repair; re-measure after a week. Changing a figure is the user's. browser-skein's 217.5, browser-temper's 127.5 and process-temper's 540 CPU seconds are 145, 85 and 360 raised by half by the user's word of 11-08, for now, to be revisited.
# Live pairs have no entry yet: the user has not set their CPU budgets here.
# Gate tables: tools/tiers/budgets.md, 6; the CI builder's 11-16 gate runs' median by tree, suite and layer, plus the larger of a tenth and a second, rounded up, by the user's word of 11-16; references and ideals from temper/docs/design/draft/test-budgets.md, 6 and 9.
# Optional per-pair auto_reap = ["test_name", ...] declares known auto-reaping tests; empty today.

# Suite paths are quoted keys, e.g. [tools."tools/tiers/test_run.py"].
[tools]

[gate.default]
references = { step = 0.04, domain = 0.2, system = 0.6, machine = 0.2, protocol = 0.2, io = 0.2, simulated = 1, real-loop = 1, end-to-end = 1, checks = 1 }

[[gate.default.moves]]
from = "temper.real-loop"
to = "temper.domain"
cpu_s = 1.5
why = "The checkout world's fake-disk delivery, merge, reuse, store and simulation stories run below the real loop in their own binary."

[[gate.default.reasons]]
binary = "skein-codegen"
test = "tests::changes_to_different_declarations_merge_line_by_line"
cpu_s = 0.4
why = "The acceptance family has 120 records and a long record split across methods; ten generations and three git merge-file merges check that independent declaration edits compose exactly. Landing run 1586 measured 0.266 CPU s alone."

[[gate.default.reasons]]
binary = "skein-codegen"
test = "tests::family_and_field_helpers_have_no_ordinals_or_long_functions"
cpu_s = 0.1
why = "The 120-record family and 100-field record force family and method splits so the output check can reject ordinal helper names and functions past the line bound. Landing run 1586 measured 0.050 CPU s alone."

[[gate.default.reasons]]
binary = "temper-engine-domain-world::suite"
test = "forge_routes::early_start::a_running_early_producer_asks_then_catches_up_with_a_squashed_dependency"
cpu_s = 0.25
why = "The running producer crosses two squashed landings, a fenced attempt's end and resume, and the world's public-document crash/restart oracle; landing run 1382 measured 0.206 CPU s alone."

[[gate.default.reasons]]
binary = "temper-engine-service-component"
test = "tests::reds::an_admitted_landed_ask_answers_from_the_domain_without_a_commit"
cpu_s = 0.06
why = "The admitted wire ask needs a real completed deployment, credential restore, claimed worker run and routed host answer; landing run 1382 measured 0.047 CPU s alone. State-only cases use the domain's step fixture instead."

[[gate.default.reasons]]
binary = "temper-box-shell"
test = "fake_backends::tests::fake_github_test_passes_ordinary_admission_without_document_forges"
cpu_s = 0.55
why = "The shell checks a provisioned sandbox and computes the joined start's operation count; that existing path constructs the service, and there is no narrower checked sizing constructor. Admission is parsed once for both assertions."

[[gate.default.reasons]]
binary = "temper-engine-service-component"
test = "setup::tests::create_tests::places_tests::owned_setup_chooses_then_keeps_one_place_and_registers_its_public_client"
cpu_s = 0.08
why = "The routing test keeps a chosen place, registers its public client, forgets it, and restores it in a second service. Its settle loop stops when its queues, domain backlog and commits drain."

[[gate.default.reasons]]
binary = "temper-engine-service-component"
test = "tests::approval::an_ask_is_answered_as_the_typed_configuration_enables_the_approval"
cpu_s = 0.07
why = "Default, explicitly enabled and disabled approval each pass their typed startup setting through a service and an encoded HTTP ask; all three outcomes and their decoded fields are checked."

[[gate.default.reasons]]
binary = "temper-engine-service-component"
test = "tests::family::deployment_reads_follow_the_box_default_and_committed_welcome_changes"
cpu_s = 0.075
why = "Box and deployment each start a service and read the welcome before and after committed set and reset decisions; both defaults and all six reads are part of the routing rule."

[[gate.default.reasons]]
binary = "temper-service"
test = "startup::welcome_policy::the_template_machine_gives_the_domain_its_places"
cpu_s = 0.2
why = "Real init documents supply the stock and test machine places, which a domain Connect must keep in its forge record. Absent and null share one stock world; the overridden machine needs a second world."

[[gate.default.reasons]]
binary = "temper-engine-domain-world::suite"
test = "forge_routes::landing::two_goals::two_goals_land_in_one_green_turn"
cpu_s = 0.27
why = "Two goals' changes, each approved by its review behind a person's latch, form one turn landing of two on one green gate run, with one fast-forward, member pulls merged at their candidates, and the landing's panel checked. Two goals forming one turn cannot be shown with fewer."

[[gate.default.reasons]]
binary = "temper-client-journeys-tool"
test = "tests::the_committed_journey_redacted_prints_the_same_pages"
cpu_s = 0.25
why = "Redaction must preserve every printed page of the whole committed welcome-set-up recording, the only web recording until the journeys are recorded again after R4 lands (temper/docs/design/client/web/journeys.md, 9); landing run 1593 measured 0.181 CPU s alone."

[[gate.default.reasons]]
binary = "temper-client-shell-web"
test = "journey::normalise::tests::committed_welcome_set_up_normalises_and_replays_to_the_end"
cpu_s = 0.30
why = "Normalisation must preserve and replay the whole committed welcome-set-up recording through the shipped host to its end, the only web recording until the journeys are recorded again after R4 lands (temper/docs/design/client/web/journeys.md, 9); landing run 1593 measured 0.210 CPU s alone."

[[gate.default.reasons]]
