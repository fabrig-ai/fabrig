draft = "note-parts"
repo = "fabrig"
sources = ["jig/docs/plan/note-parts/inputs/request.md", "jig/docs/design/draft/notes-memory.md", "AGENTS.md", "DESIGN.md"]
# Plan options, written by fab call cut --set; keep them
priority = true
# Lands after ui-chat-draft, whose trunk this one was made from (inputs/request.md). See plan.md.
after = ["ui-chat-draft"]

[buffer]
low = 1.0
high = 2.0

[[part]]
id = "note-range"
title = "jig: note takes a line range, and its refusals say what to do next"
mode = "direct"
needs = []
design = "jig/docs/design/domain/engine.md, 10"

[[part]]
id = "task-notes"
title = "temper ctl: task notes reads a task's notes whole"
mode = "direct"
needs = []
design = "temper/docs/design/client/tools.md, 5.2"

[[slice]]
id = 1
story = "jig's machine builds a note in parts and recalls it whole, and ctl can read one"
parts = ["note-range", "task-notes"]
walk = false

[[part]]
id = "note-tool"
title = "temper: a run writes a note by lines, and its instructions say to"
mode = "direct"
needs = ["note-range"]
design = "temper/docs/design/domain/agent.md, 8.3"

[[part]]
id = "note-walk"
title = "temper: a scripted model builds a 30 KB note in parts, through ctl on a fake box"
mode = "direct"
needs = ["note-tool", "task-notes"]
design = "temper/docs/design/domain/agent.md, 8.3"

[[slice]]
id = 2
story = "a chat builds a 30 KB document in calls of under 10 KB, revisions in order, read whole as its pane reads it"
parts = ["note-tool", "note-walk"]
walk = false
