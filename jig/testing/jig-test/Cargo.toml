[package]
name = "jig-test"
description = "The reference one-process service and agent command"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-fail-stop.workspace = true
jig-test-service.workspace = true
jig-protocol-config.workspace = true
jig-domain-link.workspace = true
jig-domain-accounts.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-json.workspace = true
skein-shell.workspace = true
skein-tls.workspace = true
skein-oauth-accounts.workspace = true
smith-agent-shell.workspace = true
smith-local-service.workspace = true
smith-host-protocol.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[dev-dependencies]
jig-test-kit.workspace = true
smith-protocol-program.workspace = true
jig-client-test-records.workspace = true
jig-client-protocol-link.workspace = true
skein-scratch.workspace = true
jig-domain-core.workspace = true
jig-test-domain.workspace = true
skein-kv.workspace = true
jig-protocol-accounts-kit.workspace = true
jig-client = { path = "../../crates/jig-client" }
skein-fake-oauth.workspace = true
skein-http.workspace = true
jig-client-protocol-kit.workspace = true
jig-channel-kit.workspace = true
jig-client-shell-native = { path = "../../crates/jig-client-shell-native" }
skein-tls-kit.workspace = true
skein-world.workspace = true
skein-fake-peers.workspace = true
skein-fake-llm-domain.workspace = true
skein-fake-llm-protocol.workspace = true
skein-llm.workspace = true
jig-protocol-store.workspace = true
serde_json = "1.0"
tempfile = "3"

[[test]]
name = "process"
path = "tests/process.rs"

[[test]]
name = "live"
path = "tests/live.rs"
