[package]
name = "jig-engine-clients-kit"
description = "The engine clients' peer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
jig-test-service.workspace = true
skein-world.workspace = true
jig-protocol-engine-clients.workspace = true
jig-protocol-engine-clients-http.workspace = true
jig-client-protocol-wire.workspace = true
jig-domain-core.workspace = true
jig-domain-tasks.workspace = true
jig-domain-accounts.workspace = true
jig-domain-authority.workspace = true
jig-domain-fleet.workspace = true
jig-protocol-config.workspace = true
jig-domain-people.workspace = true
jig-domain-views.workspace = true
skein-http.workspace = true
skein-lib.workspace = true
skein-io.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
