[package]
name = "jig-core-kit"
description = "The core's driver, peers and referee"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
jig-test-profile.workspace = true
jig-client-test-records = { path = "../../testing/jig-client-test-records" }
jig-conformance.workspace = true
jig-test-domain.workspace = true
jig-test-store-files.workspace = true
jig-test-store.workspace = true
jig-protocol-store.workspace = true
jig-fake-workers.workspace = true
jig-fake-parties.workspace = true
jig-test-connector.workspace = true
jig-test-connector-kit.workspace = true
jig-test-system.workspace = true
jig-domain-core.workspace = true
jig-domain-host.workspace = true
jig-domain-tasks.workspace = true
jig-domain-people.workspace = true
jig-domain-authority.workspace = true
jig-domain-fleet.workspace = true
jig-domain-accounts.workspace = true
jig-domain-link.workspace = true
jig-domain-notes.workspace = true
jig-domain-views.workspace = true
jig-protocol-tools.workspace = true
jig-protocol-charter.workspace = true
smith-channel.workspace = true
skein-lib.workspace = true
skein-world.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
