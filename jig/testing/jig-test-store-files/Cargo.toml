[package]
name = "jig-test-store-files"
description = "The real store over memory and skein's crashing file machine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-conformance.workspace = true
jig-test-store.workspace = true
jig-test-domain.workspace = true
jig-test-connector.workspace = true
jig-protocol-store.workspace = true
jig-domain-core.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-kv.workspace = true
skein-fake-machine.workspace = true
skein-sim.workspace = true

[dev-dependencies]
jig-domain-people.workspace = true
jig-domain-notes.workspace = true
jig-domain-tasks.workspace = true
jig-test-connector-kit.workspace = true
jig-test-profile.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
