[package]
name = "jig-client-test-shell-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
test = false
doctest = false
crate-type = ["cdylib"]
[target.'cfg(target_arch = "wasm32")'.dependencies]
jig-client.workspace = true
jig-client-test-domain.workspace = true
jig-client-test-view.workspace = true
jig-client-test-protocol-wire.workspace = true
jig-client-view.workspace = true
jig-client-protocol-http.workspace = true
jig-client-protocol-link.workspace = true
jig-client-shell-web.workspace = true
skein-lib.workspace = true
skein-ui.workspace = true
skein-ui-web.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true }
[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
