# This protocol world adds a Cell ban to jig/tests/clippy.toml's replay bans:
# native scenario handoffs use Cell for inherited pipes between iterations,
# and each such handoff needs a scoped exception.
disallowed-types = [
    { path = "core::cell::Cell", reason = "scenario handoffs need a narrowly documented exception" },
    { path = "std::collections::HashMap", reason = "ordered maps replay from a seed" },
    { path = "std::collections::HashSet", reason = "ordered sets replay from a seed" },
    { path = "std::time::Instant", reason = "the world owns time" },
    { path = "std::time::SystemTime", reason = "the world owns time" },
]

disallowed-methods = [
    { path = "std::thread::spawn", reason = "one replayable world thread" },
]
