[package]
name = "jig-channel-world"
description = "Joint engine and worker services with Smith agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-channel-kit.workspace = true

[dev-dependencies]
skein-llm.workspace = true
skein-fake-llm-domain.workspace = true
serde_json.workspace = true
smith-transcript.workspace = true
jig-domain-link.workspace = true
smith-fake-claude.workspace = true
jig-domain-core.workspace = true
jig-domain-accounts.workspace = true
jig-domain-host.workspace = true
jig-domain-tasks.workspace = true
jig-protocol-worker-wire.workspace = true
skein-lib.workspace = true
skein-world.workspace = true
skein-sim.workspace = true
smith-agent-process-world.workspace = true
smith-domain.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
