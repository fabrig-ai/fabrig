[package]
name = "jig-worker-link-world"
description = "The worker link against a scripted engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
skein-lib.workspace = true
jig-domain-host.workspace = true
skein-codec.workspace = true
jig-domain-link.workspace = true
jig-protocol-worker-link.workspace = true
jig-protocol-worker-wire.workspace = true
skein-channel.workspace = true
skein-fake-channel.workspace = true

[dev-dependencies]
skein-world.workspace = true
jig-protocol-config.workspace = true
jig-test-service.workspace = true
jig-protocol-engine-workers.workspace = true
skein-io.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
