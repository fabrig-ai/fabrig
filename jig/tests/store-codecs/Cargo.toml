[package]
name = "jig-store-codecs-world"
description = "The store families' generated codecs world"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dev-dependencies]
jig-domain-tasks.workspace = true
skein-oauth.workspace = true
jig-client-protocol-wire.workspace = true
skein-scratch.workspace = true
jig-domain-core.workspace = true
jig-domain-people.workspace = true
jig-protocol-config.workspace = true
jig-protocol-store.workspace = true
jig-test-store.workspace = true
skein-codec.workspace = true
skein-codegen.workspace = true
skein-lib.workspace = true
skein-kv.workspace = true
skein-heap.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[[test]]
name = "drift"
path = "tests/suite/drift.rs"
