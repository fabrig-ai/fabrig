[package]
name = "jig-tasks-world"
description = "Tasks with scripted agents, authority and a durable parent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dev-dependencies]
jig-domain-authority.workspace = true
jig-core-kit.workspace = true
jig-domain-core.workspace = true
jig-domain-people.workspace = true

[dependencies]
jig-tasks-kit.workspace = true
skein-lib.workspace = true
skein-world.workspace = true
jig-domain-tasks.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
