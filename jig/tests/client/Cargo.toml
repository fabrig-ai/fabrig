[package]
name = "jig-client-world"
description = "Reusable client shell world with people and scripted truth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-client-kit.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[dev-dependencies]
jig-core-kit.workspace = true
jig-test-profile.workspace = true
jig-client-test-protocol-wire.workspace = true
jig-client.workspace = true
jig-client-protocol-link.workspace = true
jig-client-protocol-wire.workspace = true
jig-client-domain.workspace = true
skein-ui.workspace = true
skein-lib.workspace = true
jig-client-view.workspace = true
jig-protocol-transcript.workspace = true
skein-ui-text.workspace = true
jig-client-test-domain.workspace = true
skein-fake-person.workspace = true
jig-client-scripted-engine.workspace = true
jig-domain-people.workspace = true
jig-client-test-kit.workspace = true
skein-world.workspace = true
smith-transcript.workspace = true
skein-scratch.workspace = true
jig-client-test-records = { path = "../../testing/jig-client-test-records" }
