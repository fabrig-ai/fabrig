[package]
name = "jig-client-browser-world"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
jig-client-fake-person-browser.workspace = true
skein-fake-person-browser.workspace = true
skein-fake-person.workspace = true
skein-scratch.workspace = true
skein-lib.workspace = true
skein-ui.workspace = true
serde_json.workspace = true
jig-client-view.workspace = true
jig-client-domain.workspace = true
jig-client-protocol-wire.workspace = true
jig-client-protocol-link.workspace = true
[dev-dependencies]
skein-world.workspace = true
jig-protocol-config.workspace = true
jig-client-protocol-http.workspace = true
[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
