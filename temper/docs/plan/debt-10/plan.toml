[[question]]
id = "listener-off-loopback"
parts = ["findings"]
text = """B2's panic looks unreachable from a document, which listener-text proves by test: both services refuse a clients' listener off loopback at the start, in every shape. But temper's configuration.md, section 3, asks for loopback only in standalone and where the printed link is on, so temper's `checks::standalone` is stricter than the design, and `[::]:7100` with the link off is in the design's bounds and refused by the code. Which stands? (a) recommended, what this plan builds: the code stands, nothing changes, and the gap is recorded as a Departs entry in configuration.status.md. (b) the design stands: a later small task relaxes the check and makes address_text print any IPv6 address, since the panic would then be real. Nothing waits on the answer."""
