[[question]]
id = "listener-off-loopback"
parts = ["findings"]
text = """B2's panic looks unreachable from a document, which listener-text proves by test: both services refuse a clients' listener off loopback at the start, in every shape. But temper's configuration.md, section 3, asks for loopback only in standalone and where the printed link is on, so temper's `checks::standalone` is stricter than the design, and `[::]:7100` with the link off is in the design's bounds and refused by the code. Which stands? (a) recommended, what this plan builds: the code stands, nothing changes, and the gap is recorded as a Departs entry in configuration.status.md. (b) the design stands: a later small task relaxes the check and makes address_text print any IPv6 address, since the panic would then be real. Nothing waits on the answer."""

[[question]]
id = "d001-bound"
parts = ["bundle-helpers"]
text = """The request says both items go. D005 goes: the bundle helpers pay it. D001 can't be paid by this plan, and its Paid when is yours to change, so this plan leaves it open with its figures updated. Its measure reads 356 and must fall below 200. It doesn't count the bundle files, so B3 doesn't move it. A read-only survey sorted the 356 by hand: about 127 generic lines (braces, imports, signatures), about 176 application-owned under service.md 11 or the item's own words, about 53 movable; every move that keeps section 11 leaves about 310, and below 200 needs a clients' part holding the pass, which 11.6 rules out and which the item's condition forbids. Which stands? (a) recommended: D001 is marked `kept`, with that reason, so a later review doesn't find it again: the overlap left is composition the design assigns to each application. (b) Restate the bound near what's reachable, say 340, and delete the item as paid. (c) Revise 11.6 and build a clients' part: about -150 on the measure, a design change that takes the pass from the applications. (d) Take the survey's small moves too (config::clients::invalid, a link owner lookup, the sizing test), about -25 on the measure, alongside (a) or (b). Nothing waits on the answer; with none, D001 stays open."""
