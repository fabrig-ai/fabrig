[[question]]
id = "parked-finish-told"
answer = """(a): no stored field. Park the run, drop its finish, and let its next run be woken by a delegate's result and read its delegates' state in its brief. Revisit only if a model is seen finishing again and again while its delegates run. Say in the design that a finish put off for live delegates leaves no trace for the next run, and why. (temper/migration, 2026-11-08)"""
text = "Item 1: a goal's first run on the program backend ended its cut with a report while the delegates it had just made were live; the tasks child refused the finish (live delegates), and the core failed the attempt invalid with no reason (jig-domain-core's route_refused_payload), three times. This plan has such a finish park the run instead (task finish-parks; jig/docs/design/domain/engine.md, 7.4): no try spent, the task waiting for its delegates' results. The parked run's finish is dropped, and its next run isn't told it tried to finish. Telling it needs a stored field (a task's note for its next run, or an InvalidResult-like value in the tasks store), which the request makes a question first. Options: (a, recommended) no: the next run is woken by a delegate's result and sees its delegates' state in its brief; revisit if a model is seen finishing again and again while its delegates run; (b) yes, in place before v0.1.0: the tasks store keeps a bounded 'finish put off for live delegates N, M' for the next run's brief, a plan of its own of about two tasks."
parts = []
