draft = "look-round-13"
repo = "fabrig"
sources = ["temper/docs/plan/look-round-13/inputs/request.md", "temper/docs/design/draft/look-requests.md", "temper/docs/design/draft/repository-copies.md", "temper/docs/design/client/greenfield/README.md", "temper/docs/design/client/greenfield/mock.css", "AGENTS.md", "DESIGN.md"]
# Plan options, written by fab call cut --set; keep them
priority = true

# The look request connect-flows: Settings' connect pages become the welcome's, and "Add repositories". See plan.md.

[buffer]
low = 1.0
high = 2.0

[[part]]
id = "look"
title = "The request's stylesheet and its look tokens"
mode = "direct"
needs = []
design = "temper/docs/design/draft/look-requests.md, 3"

[[part]]
id = "dismiss"
title = "A failed repository making is dismissed: the request, on the wire and in the connector"
mode = "direct"
needs = []
design = "temper/docs/design/domain/forge.md, 4.5"

[[part]]
id = "welcome"
title = "All ways leaves the welcome's way pages"
mode = "direct"
needs = []
design = "temper/docs/design/client/README.md, 3.5"

[[slice]]
id = 1
story = "The pieces every connect page and the sheet stand on: the rules, a dismissal, a welcome with one way back"
parts = ["look", "dismiss", "welcome"]
walk = false

[[part]]
id = "model"
title = "Connect a model takes the welcome's cards and panels, and lands on Accounts"
mode = "direct"
needs = ["look"]
design = "temper/docs/design/client/README.md, 3.5"

[[part]]
id = "forge"
title = "Connect a forge takes the welcome's cards and panels, and sets up in the row"
mode = "direct"
needs = ["look"]
design = "temper/docs/design/client/forge.md, 5.4"

[[slice]]
id = 2
story = "A person connects a model and a forge from Settings on the welcome's cards, and lands on the row they added"
parts = ["model", "forge"]
walk = false

[[part]]
id = "sheet"
title = "The sheet Add repositories: its picker, sources and rows, over Settings' Repositories"
mode = "direct"
needs = ["look", "dismiss"]
design = "temper/docs/design/client/README.md, 4.4"

[[part]]
id = "proof"
title = "The render check, the account and the design in line"
mode = "direct"
needs = ["look", "welcome", "model", "forge", "sheet"]
design = "temper/docs/design/draft/look-requests.md, 4"

[[slice]]
id = 3
story = "A person adds repositories from Settings: adopts from a long list by search and scroll, copies, makes one, and dismisses a failed copy"
parts = ["sheet"]
walk = false

[[slice]]
id = 4
story = "The landing is proved against the request's pages and accounted for"
parts = ["proof"]
walk = false
