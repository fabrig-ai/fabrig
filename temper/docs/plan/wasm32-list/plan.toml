[[question]]
id = "wasm32-more"
text = """The design names crates for the gate's wasm32 clippy that fab's list (.config/gate/wasm32.txt, task gate-list) does not hold: skein's other portable crates (lib, io, the simulator, the shell, skein-sim-world, the fake machine, the fakes, kv, http, json, channel, codec, tls; skein's testing.md 6 and 10, lib.md 2, shell.md 14, world.md 8), jig-client-test-shell-web, jig's client crates and jig-protocol-transcript (jig's protocol/browser.md 15 and 18, protocol/README.md 11), temper-client-domain, -view, -protocol-wire and -shell-web (temper's client/browser.md 4.3), and smith-agent-shell with its smith dependencies (smith's shell.md 2.5). Only temper-client-shell-web is measured (red: too_many_lines at turn); the rest are unmeasured. Each added package lengthens the gate's clippy-wasm32 step. Default taken: the list stays at the request's six and task wasm32-status records the rest as Not yet. Options: a follow-up draft measures each named crate for wasm32 clippy at main, adds the green ones to the list and gives each red one to its tree as a repair (recommended); or keep six and let the Not yet entries stand; or narrow the design to the six."""
parts = ["wasm32-status"]
