[[question]]
id = "hold-last-failure"
parts = ["server-page"]
text = """Finding 4's second half: should a held task name its run's last failure? It cannot without a stored-format change, so this plan does not build it. The failure's text reaches the engine's stderr alone (temper-engine-domain/src/link.rs, RunDiagnostic); jig-domain-hub-link/src/payload.rs reduces the ending to its class, and every durable record holds the class (jig-protocol-store's tasks-v9, core-v6). Options: (a) the reason stays in the log, and the page says where and how to read it, which this plan's server-page does; (b) a draft of its own stores the last failure's bounded text with the hold (tasks-v9, and core-v6 to survive a replay, a path through jig's core) and shows it to people alone: domain/worker.md, 4.3 lets no LLM see this detail, and hold.words reaches the LLM's task read today (temper-engine-smith/src/answers.rs), so it needs a field of its own or a client-only path. Recommendation: (a) now, (b) only if reading the journal proves too little. No task waits for this."""
