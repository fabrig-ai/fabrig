[[slice]]
id = 2
story = "story A's world, stepped by skein's slices, posts its printed link, and its visitor spends the link at the clients' listener as a browser does"
parts = ["visitor"]
walk = false

[[part]]
id = "native-walk"
title = "temper: story A walked natively through the web client's host on skein's bridge in memory, its session log kept and replayed"
