design = "temper/docs/design/client/browser.md, 4.6"

[[slice]]
id = 6
story = "story A walks in the browser on the built playground, from the welcome to the CSV change landed and the other two requests answered: in the browser tier's headless Chromium, and by hand on Firefox and Safari on a desktop; its log downloaded replays natively"
parts = ["browser"]
walk = true

[[question]]
id = "bars"
parts = ["browser"]
text = """The playground's bars for v0.1.0 are yours (temper's playground.md, 8, 10 and 11): the download's is 6 MB gzipped; the world's memory high water (the draft's 256 MiB was a phone's) and the longest slice (a page that answers while the world steps) have none for a desktop browser. Task browser-walk measures the three in the browser tier and writes them to temper/docs/development/playground-figures.md; no test enforces a bar. Default taken: figures reported, no bar enforced. Options: (a, recommended) once the figures are in, set the memory and slice bars at about 1.5 times what story A measures, and have the tier fail past them in a follow-up task; (b) keep them reported only until a second story exists."""

[[question]]
id = "download-address"
parts = ["page"]
text = """The frame offers "the way to the real thing (the download)" (temper's playground.md, 2), but no document names the download's address: release.md says the site links the release's files, and the site's design is not written. Default taken: the frame says where the download is in words, with no link (task page-feature). Options: (a, recommended) when the site's design names its download page, a one-line follow-up gives the frame that link; (b) link the release's page on the forge now, if you name its public address."""
