[[slice]]
id = 3
story = "story A walked natively by skein's fake person through temper's web client host on the in-memory bridge, from the welcome to the CSV change landed and the other two requests answered, its log kept and replayed"
parts = ["native-walk"]
walk = false

[[part]]
id = "worker"
title = "temper: temper-playground on wasm32 is the worker's module, its start over skein's slices"
mode = "direct"
needs = []
design = "temper/docs/design/playground.md, 3"

[[part]]
id = "page"
title = "temper: temper-client-shell-web's feature playground, the worker's platform, the starter, the frame and the failure page"
mode = "direct"
needs = []
