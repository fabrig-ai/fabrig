# The playground in the browser, part three (inputs/request.md): the native walk through the web
# client's host first, then the page and the served files, then the browser walk. skein's kit is
# used as it is; temper's composition gains the visitor; temper's shell gains `playground`.

[buffer]
low = 1.0
high = 2.0

