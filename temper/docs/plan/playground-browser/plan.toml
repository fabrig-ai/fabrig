id = "shell-clippy"
title = "temper: temper-client-shell-web passes wasm32 clippy, its turn split, and joins the gate's wasm32 list"
mode = "direct"
needs = []
design = "temper/docs/design/client/browser.md, 4.3"

[[slice]]
id = 1
story = "the browser shell's wasm32 clippy passes with no lint exception, and the gate's wasm32 list holds it"
parts = ["shell-clippy"]
walk = false

[[part]]
id = "visitor"
title = "temper: skein's visitor joins the playground's composition, which runs in skein's slices with its link printed to the world"
mode = "direct"
needs = []
