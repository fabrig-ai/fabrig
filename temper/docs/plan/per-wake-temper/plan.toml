[[question]]
id = "charter-size-refusal"
answer = "Yes: name the charter, its stored size and the bound. Add the member jig's refusal detail needs, in place, across client wire 19 and the people family's stored refusals, with no version bump or migration (no compatibility before v0.1.0); temper/ui was told first, by seam 2, and sees no collision. The clients that render a refusal's detail (temper-client-tools: src/jig/render/acts.rs, render/document/me.rs, jig/settings_adapter.rs) show the new member in ctl's words, as `charter 5: stored policy: supplied 70112; maximum root.journal.run_bytes 65536`. Keep the existing refusal kinds. A row in an existing refusal test, and the schemas regenerated."
text = "Should a change of settings refused for a charter's stored size name the charter, its size and the bound, as request item 6 and the draft's section 8 ask? Today jig's core refuses it as the charter's item out of shape (jig/crates/jig-domain-core/src/settings/check.rs, `parts_fault`: `Fault::Shape`, no detail), and ctl prints `settings apply: out of shape; item 1; charter 5: shape`. jig's refusal detail (`SettingDetail`: member, supplied, bound) names a charter's documents alone, and it crosses the client wire 19 (`client-v19-part1.schema`) and is kept in the people family's stored refusals (`people-v14.schema`, `SettingDetail`), so naming the size and the bound adds a member to a protocol and a stored format: yours, and the request makes any such change a question first. The start already names them (`temper-service/src/startup/problems.rs`: `charter N: B bytes, past root.journal.run_bytes of L`). This plan builds the rest without it and keeps the draft's status lag 8 open. Options: yes, in place before v0.1.0, as a plan of its own of two or three tasks: jig's `SettingMember` gains the charter's stored policy (supplied its bytes, bound `core.run_bytes`, rule maximum) in the core, both translations, the wire and the people store; then ctl's and the host's words, `charter 5: stored policy: supplied 70112; maximum root.journal.run_bytes 65536`, a row in ctl's refusal table (recommended); or no, ctl's words for a charter's `shape` add that its stored policy may pass `root.journal.run_bytes`, naming neither figure."
parts = ["focused"]
