[[part]]
id = "fit"
title = "The worker wire fits a resumed start's committed calls to a room, the newest answers whole and the rest cut to words naming their bytes, and measures the smallest resumed start"
mode = "direct"
needs = []
design = "jig/docs/design/protocol/channel.md, 9"

[[slice]]
id = 1
story = "A resumed start past a room by its committed calls comes back within it, every call told by name and tool, the newest answers whole, the rest cut to words naming their bytes, a delivery whole"
parts = ["fit"]
walk = false

[[part]]
id = "named-floor"
title = "temper refuses at start limits under which even the smallest resumed start passes the engine's room, naming io.output and that start's bytes"
mode = "direct"
needs = ["fit"]
design = "temper/docs/design/protocol/configuration.md, 7"

[[part]]
id = "fit-room"
title = "The engine's link fits a resumed start's committed calls to its room before measuring it, and is not made under limits whose smallest resumed start passes the room"
mode = "direct"
needs = ["fit"]
design = "jig/docs/design/protocol/channel.md, 9"

[[part]]
id = "temper-fits"
title = "On temper's stock settings a producer resumed with every committed call its settings admit crosses to temper's worker, on both profiles"
mode = "direct"
needs = ["fit-room"]
design = "temper/docs/design/domain/worker.md, 4.3"

[[slice]]
id = 2
story = "Limits under which no resumed start can fit the engine's room are refused at start: engine.limits.io.output, short of the smallest resumed start, with its bytes"
parts = ["named-floor"]
walk = false

[[slice]]
id = 3
story = "On each stock profile, a producer resumed with more committed calls at the largest answer than one start carries crosses the joined link, told every call, its newest answers whole, and its turn and answer go up"
