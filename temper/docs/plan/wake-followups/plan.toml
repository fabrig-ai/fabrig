[[question]]
id = "too-large-facts"
text = "Request item 3 asks a forge read refused as too large to name the bound it met and the size it measured. skein's `api::Error::TooLarge` is fieldless and `Copy` (skein/crates/skein-forge/src/api.rs), and temper stores it: a named call's read answer is kept in temper's store-v11 as `Error` tag 6 with no payload (temper/crates/temper-protocol-store/schema/store-v11.schema; temper-engine-domain-forge/src/boundary.rs, `CallPayload::Refused` and `Read`), so a host asked again answers from that record (smith/docs/design/domain/run.md, 5.2). Carrying the facts is a public-interface change in skein and a stored-format change in temper, which the request makes a question first, and temper's design already says those decisions are their owners' (temper/docs/design/domain/forge.md, section 20, 'A forge read past its bound'). The heads-up: `TooLarge` is produced across skein-forge's dialects (about 300 lines, many where no client bound is known) and skein-forge-client's eleven admission and answer checks, and read in skein-forge, skein-forge-client, temper-engine-domain, temper-engine-domain-forge, temper-engine-smith and temper-protocol-store, with test readers in skein-forge-connection, skein's forge dialect, machine and client worlds, temper's engine forge world and temper's system world. Options: (a, recommended) yes, in place before v0.1.0, as a plan of its own of three tasks: skein's `TooLarge` gains `{ bound, measured }` (the bound one of forge.client.rows, answer_bytes, op_bytes or none known, the measure exact or absent), every producer and reader in skein and temper's forced patterns; temper's store-v11 `Error::TooLarge` keeps them, schema and goldens regenerated; then temper's words name them in `read_pull_files`, `read_compare` and a review's held reason; (b) the forge client alone reports them beside a bare `TooLarge` on a fresh read, temper words them live and stores nothing new, so an answer asked again after a restart words the size as unknown, breaking 'answered from its record'; (c) no: keep forge.md's default, the files-omitted notice and the unknown measure."
parts = []
