[[question]]
id = "home-what-changed"
parts = ["home-everyday"]
text = """The request project-home-everyday draws Home's intro as what changed since the person last looked: "you last looked an hour ago" in the kicker, what landed in the headline, a lede and a byline ("Written by T3's agent, 4 min ago"). No client is given when a person last looked (jig keeps positions, not times), and nothing writes that intro; the message itself leaves the writer open. Each is a new fact of a protocol or a stored one, so yours (temper/docs/design/draft/look-requests.md, 6). Default taken, and no task waits: the kicker is the day and time, the headline counts what needs the person in the project, no lede and no byline. Options: (a, recommended) keep the default now, and draft the intro's writer with the status agent, since the landed line and the last look need it anyway; (b) a stored last-look time alone, a party's own, as Dismissed is, as a follow-up plan."""

[[question]]
id = "home-answers"
parts = ["home-everyday"]
text = """The request draws a question on Home with its context, choices with one recommended, "Reply" and "Later", then a green line with "Undo" once answered. jig's question carries words alone, nothing recommends a choice, and no request retracts an answer: each is an upstream change to jig's contract, so yours (temper/docs/design/client/README.md, 11, The mockups' question card). Default taken, and no task waits: the card shows the asked task's link, its kind, age and words, with "Reply" going to the project's inbox, which answers in words; "Answer" on a phone and "Answer in a row" go there too; no "Later", no green line, no "Undo". Options: (a, recommended) keep the default until jig's question form carries choices, then land the card whole with its own draft; (b) answer in words in place on Home now, a text field the request doesn't draw, with the client's existing acts."""

[[question]]
id = "home-landing-line"
parts = ["home-everyday"]
text = """The request ends Home with "Landing: main last moved 1 h ago · nothing queued", and "Landing: nothing has landed yet" on a new project. No client is given a project's landing branch's last move or its queue's depth: the landings panel lists turns alone, since a queue's merge makes no landing task, so neither sentence can be said honestly. It is a new fact of the forge's client protocol, so yours. Default taken, and no task waits: Home draws no such line; its rule is in the stylesheet. Options: (a, recommended) a draft for a project's landing fact in temper's client wire, then the line; (b) drop the line from Home for good."""

[[question]]
id = "home-goals"
parts = ["home-everyday"]
text = """The request says that with goals on, as the default configuration may have them, Home shows Goals instead of Chats, each a row with its id, progress and state. The default configuration is still yours to settle, no fact tells a client that goals are on, and the private Board isn't built. Default taken, and no task waits: Home always shows Chats. Options: (a, recommended) settle it with the default configuration, then a plan of its own; (b) treat a project whose `me` offers the goal template as goals on, which every stock project does, so every Home would show Goals."""

[[question]]
id = "to-begin-landing-by"
parts = ["to-begin-card"]
text = """to-begin.md, 3 has the second step name temper's landing turn for a project landing by turn. No client is given a project's `by` (temper/docs/design/domain/landing.md, 13.1: it is the document's `landing` member until it is a setting). Giving it is a new fact of a protocol, so yours. Default taken, and no task waits: the step has the merge queue's words on every project, recorded as Design departs in to-begin.status.md. Options: (a, recommended) keep the default until kind 4 is a setting the `settings` document shows, which needs no protocol of Home's own; (b) add `by` to the forges' rows."""
