[[question]]
id = "d019-shared-table"
text = """jig's D019 asks that jig's 40 test and shell manifests take their lints from a shared table (`[lints] workspace = true` or one table per kind of crate), changing only manifests, clippy.toml files and scoped #[expect]s. Cargo cannot give that: a member shares only the root's `[workspace.lints]`, all or nothing (cargo 1.95 refuses a member's overrides beside `workspace = true`, and has no named tables), and the root's table is the step code's, under which these crates would trip on the order of ten thousand sites (grep estimates: about 7,400 assertions without a message, 2,600 indexings, 1,950 arithmetic operators, 1,440 panic!s, 2,850 integration tests outside a test module). Options: (a) recommended, what this plan builds: pay D019's other two clauses now (no manifest allows a disallowed_* lint; every extra clippy.toml says why it differs, or goes), write the 40 blocks in one form, and keep D019 open for its first clause, which waits for the cross-tree lint profiles skein's D036 and temper's D011 already name; (b) add now a gate check that holds each jig test and shell manifest to one named profile, a new tool across the trees and the start of D036's plan; (c) move all 40 to `workspace = true` with crate-root #![expect] lists (about 77 crate roots, not scoped). Nothing waits on the answer: (b) or (c) is a later plan."""
parts = ["jig-lints"]
