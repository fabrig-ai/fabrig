draft = "long-words"
repo = "fabrig"
sources = ["temper/docs/plan/long-words/inputs/request.md", "AGENTS.md", "DESIGN.md"]
# Plan options, written by fab call cut --set; keep them
after = ["chat-reading-c"]

# One long message can't stop a chat being read, and a person can write one; see plan.md.

[buffer]
low = 1.0
high = 2.0

[[part]]
id = "line-words"
title = "A line's words are read to long_text and draw whole"
mode = "direct"
needs = []
design = "temper/docs/design/client/README.md, 5.4"

[[part]]
id = "kept-words"
title = "A thread bounds a person's kept words by their bytes"
mode = "direct"
needs = []
design = "jig/docs/design/client/domain/client.md, 10"

[[slice]]
id = 1
story = "a page holding a line past a field's text reads whole, through the real engine"
parts = ["line-words", "kept-words"]
walk = false

[[part]]
id = "view-prices"
title = "A long line draws whole, at the view's prices"
mode = "direct"
needs = ["line-words", "kept-words"]
design = "temper/docs/design/client/README.md, 5.4"

[[part]]
id = "read-ends"
title = "An answer that can't be decoded ends its read"
mode = "direct"
needs = ["line-words"]
design = "jig/docs/design/client/domain/client.md, 16"

[[part]]
id = "read-ends-page"
title = "A page says its read ended, and its other lines and acts go on"
mode = "direct"
needs = ["read-ends", "view-prices"]
design = "temper/docs/design/client/README.md, 5.15"

[[part]]
id = "person-bound"
title = "me says the most bytes a party's words may have"
mode = "direct"
needs = ["read-ends"]
design = "jig/docs/design/client/domain/contract.md, 5.1"

[[slice]]
id = 2
story = "a chat of long lines reads whole in both shells, at the view's prices"
parts = ["view-prices"]
walk = false

[[slice]]
id = 3
story = "a line the client can't take ends its read, and the page says so and goes on"
parts = ["read-ends", "read-ends-page"]
walk = false

[[slice]]
id = 4
story = "a client knows what one message holds before it sends"
parts = ["person-bound"]
walk = false

[[part]]
id = "composer"
title = "A person can write a paragraph, and is told past what one message holds"
mode = "direct"
needs = ["person-bound", "kept-words", "view-prices", "read-ends-page"]
design = "temper/docs/design/client/README.md, 5.4"

[[slice]]
id = 5
story = "a person pastes a long paragraph, sends it and reads it back; past what one message holds it stays, Send is disabled and a line says how far over"
parts = ["composer"]
walk = false
