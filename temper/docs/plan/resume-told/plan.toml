text = "A run that parks with a conflict marker left keeps none of that run's edits, though what it saved earlier stands (temper/docs/design/domain/worker.md, section 12). Keeping them needs the list of files in conflict stored past the hold, a stored format change. Leave it, with the run told to settle before it asks, or store the list? I recommend leaving it until a replay shows runs parking in conflict: no task waits for this."
