[[question]]
id = "landing-settings-rest"
parts = ["settings-landing"]
text = """M1's Builds names the landing rules as settings of temper's kinds, out of Config's landing member. Moving them needs jig's application settings (jig's domain/engine.md, 17.5 to 17.7), which are not built: jig's setting kinds are closed enums, no application declares a kind and no connector judges or keeps one. The rest is about ten tasks, four in jig then six in temper (the forge's Setting family in store-v11, routing through the root, standing requirements 5 and 6, the stock's kind declarations with application.landing refused, the entrance's decoding, ctl's landing-rule kind), two waves past the rest of M1. Default taken: settings-landing-rules (the forge's pure surface) is released, and M1 keeps the rules in the document's application.landing, the reference's landing.json carrying main's rule and the goal branches' rule (temper's protocol/configuration.md, 13.9); the walk needs nothing more. Options: (a, recommended) the rest goes with M3, whose forge's charters as settings (kind 3) need jig's application settings too, so jig's 17.5 to 17.7 is built once for both; (b) a second cut of this plan designs and releases the ten tasks now, beside the rest of M1."""

[[question]]
id = "pre-pr-checks"
parts = ["settings-reference"]
text = """The reference's project checks (.temper/pre-pr, temper's protocol/configuration.md, 13.9) are format, lints, the changed packages' focused tests and the counted baselines. They run in the box's worker at every delivery, so lints and tests are cargo builds there, whose machine, budget and timeouts are yours. Default taken: settings-pre-pr writes a first edition with the format check and the old-form counts only (no build); the lints and focused tests stay a Not yet in configuration.status.md. Options: (a, recommended) keep it so for M1's walk, the trunk's checks and g's tier (M9) covering lints and tests; (b) add clippy and the changed packages' focused tests now, with a timeout and a worker budget you set."""
