# M1 of temper/docs/design/draft/reference-case.execution.md: the goal's own branch g.
# Four families: bound (a result's bound past the settings schema's cap, released first),
# goal (g and jig's holds and templates), change (`change` and the change procedure under the
# landing branch's rule) and settings (the landing rules as settings, a charter's default
# wake policy, the reference's first editions). The shapes that cross them are
# notes/contracts.md; the designers write each family's design with its specs.

