[[question]]
id = "hold-failure-text"
text = "Should a task held out of tries keep its last failure's text on the hold, so task show can print it? Today only the class is stored and the text is in the engine's log, and hold-look makes the words say where to look, which holds whatever the answer. What it stores: the last failure's text, one per hold, replaced by each failure. Its bound: for you to set; the log keeps a 4096-byte tail (temper/crates/temper/src/host.rs, run_detail_line), and 1024 bytes with control bytes escaped would be enough to read. Who may read it: whoever may read the task, in task show, --json and the browser, where today it takes access to the engine's log. A failure's text can hold what a run saw: tool output, paths, a provider's error, an echoed credential; it can't be redacted reliably. No LLM is shown it today, while a hold's words reach the LLM's task read (temper-engine-smith/src/answers.rs), so it needs a field of its own. Narrowing readers to owners and maintainers would be further work, and this cut didn't check how. Cost: a stored format, so hard to reverse: jig's tasks and core schemas, the hub link's payload and the client wire all move a version, with their goldens and migration, roughly four to six tasks in a plan of its own (temper/docs/design/domain/worker.md, section 12). Options: no, the words alone (recommended, until they prove too little); or yes, with your bound and readers."
parts = ["hold-look"]
