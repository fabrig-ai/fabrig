# temper v0.1.0's QA ladder (temper/docs/design/draft/v0.1.0.md, 2 to 4), walked by QA and
# taken by fab's findings loop (the agents repository's docs/design/qa.md, 2). Each rung is a
# story on one backend: its brief is the kit, the backend's kit, then the story's brief, read in
# order; a rung's edition is their bytes at origin/main. The stories were first climbed by hand
# on 11-01 (owned Forgejo on ChatGPT and Claude Code, 0 to B2; GitHub connected 0 to B0).
draft = "v0.1.0-ladder"
repo = "fabrig"
landing = "queue"

[ladder]
happy_path = "temper/docs/design/draft/v0.1.0.md, 2 and 4"
backlog = "temper/docs/design/debt/v0.1.0-ladder.md"

[[rung]]
id = "r0"
backend = "chatgpt-forgejo"
brief = ["kit.md", "rung-0.md"]
after = []

[[rung]]
id = "ra"
backend = "chatgpt-forgejo"
brief = ["kit.md", "rung-a.md"]
after = ["r0"]

[[rung]]
id = "rb0"
backend = "chatgpt-forgejo"
brief = ["kit.md", "rung-b0.md"]
after = ["ra"]

[[rung]]
