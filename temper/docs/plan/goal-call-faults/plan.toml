[[question]]
id = "read-room"
text = "Item 3: a process with no local agent (an engine alone) reads a task's words in pieces of the deployment's documents.text_bytes, 128 in the reporting deployment's document (temper init writes 512 since 2026-11-05), because the engine is never told its workers' agents' reply bound (smith's host_reply_bytes, the agent's tool_payload: 10,662 at init's figures); a larger page would reach a run past that bound as TooLarge at every offset (temper/docs/design/domain/root.md, 5.2; agent.md, section 10). A page as large as the reply allows needs that bound at the engine. Options: (a, recommended) each worker names its agents' host reply bound in its hello on jig's worker link, and the engine sizes each read by the worker running the attempt, as a local agent's does: a protocol change of jig's link, a byte count jig carries without naming smith; (b) the engine's document names each worker's reply bound in hosts.workers: a configuration change, unchecked against the worker's own; (c) neither: the page stays the documents' window, and a deployment raises its own documents.text_bytes, a figure of its configuration. This plan builds nothing for item 3 but the design's account of the page; the answer starts a plan of its own."
