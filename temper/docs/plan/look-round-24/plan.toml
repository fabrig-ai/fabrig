draft = "look-round-24"
repo = "fabrig"
sources = ["temper/docs/plan/look-round-24/inputs/request.md", "temper/docs/design/draft/look-requests.md", "temper/docs/design/draft/stock-ways.md", "temper/docs/design/client/greenfield/README.md", "temper/docs/design/client/greenfield/mock.css", "AGENTS.md", "DESIGN.md"]
