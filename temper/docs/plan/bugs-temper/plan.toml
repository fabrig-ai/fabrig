[[question]]
id = "duplicate-identity"
text = """Bug 2 asks that a duplicate person's identity refuse the page instead of panicking at Person(2). jig's design says the opposite: jig/docs/design/domain/engine.md, 6 has a start judge no record and panic at a link it cannot make, a writer's bug, with nothing else built for it (the user, 10-28). The assertion dates from 10-30 and follows that rule; the ignored test and the status line came after it. Which holds? (a) recommended, what this plan's task builds by default: the design holds and the panic stands. The ignored story runs on an oversized identity, which a start does refuse, a second test holds the panic, and the status line goes; no product code changes, so the bug's behaviour does not change, and the rule that a fix's test fails on the old code has nothing to apply to. (b) a duplicate identity refuses the start: a new typed cause in jig-domain-people and a new failure in jig-domain-core, jig/docs/design/domain/engine.md, 6 revised to list it, which reverses the rule of 10-28 for this one row. Nothing waits on the answer; (b) is a small later task in jig that turns the panic test into a refusal test."""
parts = ["start-story"]
