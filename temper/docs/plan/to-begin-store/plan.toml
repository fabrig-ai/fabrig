[[question]]
id = "party-erasure"
text = """The draft (5) has a Dismissed row 'erased with its project or its party'. jig erases no party: a member taken out of the configuration stays a party, no store row of a person is ever erased, and a connector is told of no such thing. Default taken, and nothing waits on the answer: a row is erased with its project alone, and a row outlives its member within the family's bound, as a Binding does. Recorded as Design departs in the draft's status and as an open question in temper/docs/design/protocol/store.md, 7. Options: (a, recommended) keep it, and let a dismissal follow a party's erasure when jig comes to have one; (b) erase the rows of parties no longer configured at a start, which temper can do alone but which erases what a member re-added would have kept."""
parts = ["store", "engine"]
