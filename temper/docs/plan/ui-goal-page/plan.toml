needs = []
design = "temper/docs/design/client/README.md, 3.5"

[[slice]]
id = 1
story = "this trunk holds the parsed need card, its choices and the toast the goal's page builds on"
parts = ["needs-base"]
walk = false

[[part]]
id = "made"
title = "a task's document says when it was made"
mode = "direct"
needs = []
design = "jig/docs/design/client/domain/contract.md, 5.1"

[[slice]]
id = 2
story = "the client reads when a task was made, from its record through its document"
