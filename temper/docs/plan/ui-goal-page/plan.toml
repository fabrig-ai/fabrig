draft = "ui-goal-page"
repo = "fabrig"
sources = ["temper/docs/plan/ui-goal-page/inputs/request.md", "temper/docs/design/draft/reference-code-production.md", "temper/docs/design/draft/template-places.md", "temper/docs/design/client/greenfield/mock.css", "temper/docs/design/client/greenfield/README.md", "AGENTS.md", "DESIGN.md"]
# Plan options, written by fab call cut --set; keep them
priority = true
# The trunk was made from ui-goals' and carries its unlanded commits; needs-base brings ui-needs'. See plan.md.
after = ["ui-goals", "ui-needs"]

[buffer]
low = 1.0
high = 2.0

[[part]]
