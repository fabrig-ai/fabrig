[[question]]
id = "fourth-profile"
text = """The request and D036 name three profiles: step, harness, binary. The manifests hold two regimes under "binary". skein-shell, skein-echo-shell, skein-ui-example-server and hearth deny arithmetic_side_effects, as_conversions, indexing_slicing and nine more, and skein-shell's unsafe needs them. temper's binary, its client shells, jig's two shells and skein's browser parts deny none of those, and temper's package alone has 41,000 lines of tests. One block for both either loosens the ring's shell or raises twelve crates by hundreds of sites, and harness can't take those twelve, since it allows wildcard_enum_match_arm in code a user runs. What this plan builds by default: four profiles, the fourth named ring (tools/lints/design.md, 2.3 and 2.4), with no level moved for either group by this split. (a) recommended: that stands. (b) three profiles, ring's extra lints dropped: skein-shell, hearth and the two examples get looser, and a small later task merges two definitions and four manifests. (c) three profiles, the twelve crates raised: a much larger later plan. Nothing waits on the answer."""
parts = ["check"]

[[question]]
id = "precheck-line"
text = """The request says the check runs in the queue's precheck beside tools/citations/citations.py. That precheck is not in fabrig, and this cut could not read it, so it does not know whether a new tool is picked up by itself. Within fabrig, lint-gate adds the check to .config/gate/README.md, and a fabrig-boundary test runs it, which the gate selects on every change, so a red holds from the day it lands. (a) recommended: add the line `python3 -I -B tools/lints/lints.py` to the precheck beside citations.py, once debt-11 lands; before then it would be red on every branch. (b) leave the boundary test as the only run. Nothing waits on the answer."""
parts = ["check"]

