[[question]]
id = "progress-runs"
parts = ["progress-value"]
text = """For the user, since the request makes a public interface beyond the drafts a question. progress-value.md says the page writes aria-valuetext "today", but no built tree reaches it: the mapping reads the progress node's own runs, and Builder::run refuses every role but text. The cut made Builder::run take a progress too, additive, no caller breaks, and the task progress-value builds it. The alternative keeps a text child and has the page part read that child's words up to its parent, which adds a patch path and leaves the builder's assertion on a child. No task waits: the default is what is built, and a different answer is a follow-up task."""
answer = ""
