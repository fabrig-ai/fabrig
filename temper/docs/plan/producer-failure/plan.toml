[[question]]
id = "finish-refused-at-the-call"
parts = ["asker-finish", "asker-left"]
text = """The request recommends refusing an asker's `finish` at the call, with the words `Your question is still open: call wait; the answer reaches this run.`, and asks for a question if that is much larger than it reads. It is larger: smith judges a `finish` with no call to its host, and the tasks child decides at the answer's commit, the run and its host knowing nothing of it (`jig/docs/design/domain/engine.md`, 7.4). No task waits for this answer; the plan goes on with (a).

Options:
(a) The run parks, as a done finish already does (`jig/docs/design/domain/tasks.md`, 5.7). No protocol or store change, and no turn spent. The story runs as asks, finishes, parks, answered, resumes, finishes, but those words reach no run: the stock coding charter says the same beforehand. A resumed run's transcript shows its earlier `finish` as accepted, then its waking instruction and the answer.
(b) Refuse at the call as well: a new crossing from jig through the worker to smith, so the run hears the words live. It changes smith's design and the worker's protocol, and (a) is still needed underneath, since a live refusal cannot cover every path to a finish.

Recommendation: (a). Choose (b) only if a run's hearing those words live is worth a protocol change; it would be a later plan on top of this one."""
