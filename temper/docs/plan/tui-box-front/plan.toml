draft = "tui-box-front"
repo = "fabrig"
sources = ["temper/docs/plan/tui-box-front/inputs/request.md", "temper/docs/design/draft/tui.md", "temper/docs/design/draft/tui.status.md", "temper/docs/design/draft/look-requests.md", "temper/docs/design/client/tui/journeys.md", "temper/AGENTS.md", "AGENTS.md", "DESIGN.md"]
# Plan options, written by fab call cut --set; keep them
owner = "temper/tui"

# plan.md says what was decided and why; notes/contracts.md binds the tasks.

[buffer]
low = 1.0
high = 2.0

[[part]]
id = "foreground"
title = "skein-shell opens the controlling terminal and takes its foreground, so that a child can stand at its parent's terminal and the parent take it back"
mode = "direct"
needs = []
design = "skein/docs/design/shell.md, 6.3"

[[part]]
id = "jig-sign-in"
title = "jig's clients' component takes a given first local link and says LinkSignedIn when the printed link signs a person in"
mode = "direct"
needs = []
design = "jig/docs/design/protocol/client.md, 8"

[[part]]
id = "linked"
title = "The forges document says whether the printed link has signed a person in since the engine started"
mode = "direct"
needs = []
design = "temper/docs/design/client/README.md, 4.6"

[[slice]]
id = 1
story = "A child takes its parent's terminal and gives it back; jig takes a given local link and says the printed link's sign-in; the forges document carries linked"
parts = ["foreground", "jig-sign-in", "linked"]
walk = false

[[part]]
id = "tui-front"
title = "The TUI in front of a box: signed in by the handed link, the welcome following the browser, the playground, quitting that stops the box, the box's state and /log"
mode = "direct"
needs = ["linked"]
design = "temper/docs/design/client/README.md, 6.17"

[[part]]
id = "box-front"
title = "temper box runs its TUI in front as a child: the handed link, the box's lines, the terminal's lines to box.log, its end the box's stop, --no-tui"
mode = "direct"
needs = ["linked", "foreground"]
design = "temper/docs/design/protocol/setup.md, 7.6"

[[slice]]
id = 2
story = "temper box in a terminal runs the TUI in front: signed in with nothing pasted, the welcome follows the browser's steps, the playground says so, quitting asks while work runs and stops the box, and a failing step shows on the quiet line and in /log"
parts = ["tui-front", "box-front"]
walk = false

[[part]]
id = "account"
title = "The landing's account of the look request tui-box-front, and the plan's status entries closed"
mode = "direct"
needs = ["tui-front", "box-front"]
design = "temper/docs/design/draft/look-requests.md, 5"

[[slice]]
id = 3
story = "The landing accounts for every frame and state of the look request, each landed, differing with its reason, or deferred to a named owner"
parts = ["account"]
walk = false
