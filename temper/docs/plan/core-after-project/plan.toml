[[question]]
id = "not-ready-on-the-wire"
text = "Request item 4 asks that a client's 30 s wait say what the core is busy with, not only that the link didn't come up. On today's wire the client cannot be told: while the engine's gate is shut (temper/crates/temper-service/src/clients/translation.rs, `not_ready`), a party's act or sign-in is answered `Again::NotReady`, a read `Why::Busy` and every watch, `me`'s among them, `WatchRefusal::Busy` (jig/crates/jig-domain-core/src/vocabulary.rs: no not-ready watch refusal), and no answer carries a reason. So the link, which `me` keeps (jig/docs/design/client/domain/client.md, 8.2), goes offline and `temper ctl` says `the link to the engine at ADDRESS did not come up within 30 s`, or, if `me` was last answered busy, that all the engine's watches are in use, which is false here. This plan builds what needs no wire change: temper serve's log names the reason (protocol/README.md, 8.2, task why-log), and a sign-in answered not ready says temper is not ready and points at that log (client/tools.md, 8.1, task sign-in-line). Telling the client more changes jig's client wire, a protocol, which the request makes a question first. Options: (a, recommended) yes, in place before v0.1.0, as a plan of its own of about three tasks: jig's `WatchRefusal` gains `NotReady` and the not-ready answers a `starting`/`not answering` reason with 8.2's step, in jig's core vocabulary, the clients' component, both translations and the wire (client-v19), with a `watches_full`-like `not_ready` fact on jig's client link; then temper's not-ready translation sends them and `temper ctl`'s deadline lines say `temper is starting: STEP` or `temper's core is not answering: REASON`; (b) the wire gains only `WatchRefusal::NotReady`, so the link's line says not ready without the reason, and the log alone names it; (c) no: the log and the sign-in's line are enough."
parts = ["core-says-why"]
