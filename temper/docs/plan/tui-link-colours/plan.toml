[[part]]
id = "jig-expiry"
title = "jig-client's link view names the expiry of the sign-in it holds, as the last sign-in's answer said it"
mode = "direct"
needs = []
design = "jig/docs/design/client/domain/client.md, 8.2"

[[slice]]
id = 1
story = "A link signed in by a link, kept, or by an approval's take names the answer's expiry in link().expires; a held credential names none; signed out drops it"
parts = ["jig-expiry"]
walk = false

[[part]]
id = "skein-background"
title = "skein's full-screen terminal asks the terminal's background with OSC 11, waits for it, and never reads an answer as a key"
mode = "direct"
needs = []
design = "skein/docs/design/ui-screen.md, 8"

[[slice]]
id = 2
story = "On the simulated machine, a terminal given a wait writes ASK_BACKGROUND after ENTER and says Answered for the colour fed, or Unanswered once the wait passes or the input ends; the answer never reaches the keys"
parts = ["skein-background"]
walk = false

[[part]]
id = "tui-local"
title = "temper-client-tui's Note of its sign-in, and the view's Connecting while the TUI signs in from the engine's link"
mode = "direct"
needs = []
design = "temper/docs/design/client/README.md, 6.14"

[[slice]]
id = 3
story = "A Tui told Local Signing on a signed-out root draws Connecting to HOST:PORT; told Ended, the sign-in screen with no refusal line; Note lines print and read back"
parts = ["tui-local"]
walk = false

[[part]]
id = "box-side"
title = "temper serve keeps its live printed link in a private file, rewritten at each link and removed at exit; the box's block names the TUI's command"
mode = "direct"
needs = []
design = "temper/docs/design/client/README.md, 6.12"

[[slice]]
id = 4
story = "A fresh box prints its block ending In a terminal: temper http://HOST:PORT, keeps its link 0600 in RUNTIME/temper/printed-link-KEY, keeps the fresh link after a spent one is opened, and removes the file when it stops"
parts = ["box-side"]
walk = false

[[part]]
id = "host-local"
title = "The TUI's host signs in from the engine's link with nothing pasted, reads it again after used or expired, falls back quietly, and notes an expiry apart from a sign-out; its journey records the new seam"
mode = "direct"
needs = ["tui-local", "jig-expiry"]
design = "temper/docs/design/client/README.md, 6.14"

[[slice]]
id = 5
story = "In the host's world, a fresh start with an engine's link file asks it, signs in by its link with no key, reads it again a second after link_used, falls back with no refusal drawn on any other end, and notes SignedOut for a sign-out before the expiry but signs in again from the file after it"
parts = ["host-local"]
walk = false

[[part]]
id = "tui-colours"
title = "The TUI's themes on the terminal's own colours: the base in its defaults, no sel, the focus in the accent, Scheme::of_background; goldens and pages reprinted"
mode = "direct"
needs = ["tui-local"]
design = "temper/docs/design/client/README.md, 6.15"

[[slice]]
id = 6
story = "The TUI's goldens name no background colour, its focused field is drawn in the accent, and sign-in-approved's pages draw the terminal's defaults in the theme's stand-ins"
parts = ["tui-colours"]
walk = false

[[part]]
id = "run"
title = "The TUI's run waits for the terminal's background before Start, reads the engine's link file for each local duty, and writes the note to its directory"
mode = "direct"
needs = ["host-local", "skein-background", "tui-colours"]
design = "temper/docs/design/client/README.md, 6.16"

[[slice]]
id = 7
story = "On skein's simulated machine, the run asks the terminal its background and starts light or dark from the answer, or dark after 200 ms; it reads a link file into a found record and writes tui/sign-in after a sign-in"
parts = ["run"]
walk = false

[[part]]
id = "joint"
title = "The client's joint world proves the TUI's sign-in from the engine's link, its fallback, its renewal and its refusal after a sign-out"
mode = "direct"
needs = ["host-local"]
design = "temper/docs/design/client/README.md, 10"

[[slice]]
id = 8
story = "In the joint world, a fresh TUI signs in from the engine's link with no key pressed, also after a browser spent the first link; a stale link falls back with nothing alarming; an expired sign-in is renewed; a signed-out TUI is not"
parts = ["joint"]
walk = false

[[part]]
id = "binary-tui"
title = "Bare temper takes the engine's link file's address first, reads the TUI's note at start, and leaves the scheme to the terminal where COLORFGBG declares none"
mode = "direct"
needs = ["run", "box-side"]
design = "temper/docs/design/client/README.md, 6.11"

[[slice]]
id = 9
story = "The binary's start chooses ADDRESS, else the engine's link file's address, else the kept one, else 8367; reads the note for that address; and gives the run no scheme when COLORFGBG names no number"
parts = ["binary-tui"]
walk = false

[[part]]
id = "again"
title = "sign-in-approved recorded again with the TUI in a runtime directory of its own and no COLORFGBG; the plan's last status entries deleted"
mode = "direct"
needs = ["binary-tui", "tui-colours", "joint"]
design = "temper/docs/design/client/tui/journeys.md, 8.2"

[[slice]]
id = 10
story = "temper-client-journeys again sign-in-approved records a journey that reads no engine's link file, walks the approval and draws dark, and its reprint is committed"
