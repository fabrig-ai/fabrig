[[question]]
id = "too-large-measure"
text = "Should a forge read refused as too large say which bound it met and the size it measured, as request item 2 asks? Today skein's forge vocabulary refuses with a bare `api::Error::TooLarge` (skein/crates/skein-forge/src/api.rs), so the review's held reason and `read_pull_files`'s refusal (temper/crates/temper-engine-smith/src/answers.rs, `read_size`) can only say 'forge.client.rows or forge.client.answer_bytes (measured size unknown)'. The forge client knows both where it refuses an answer (skein-forge-client, `bounds.rs`); a provider plan stopping on a file side knows the cap and a lower bound only. Carrying them changes skein's forge interface (`TooLarge` gains the bound and the measure, exact or at least) and temper's stored answer (temper-protocol-store's store-v11 `too_large`, its codec and goldens), so it is a public interface and a stored format: yours, and the request makes it a question first. This plan builds the rest of item 2 without it: a review of a small change to a large document starts, with a files-omitted notice. Options: yes, in place before v0.1.0, as a plan of its own of about three tasks (skein's vocabulary and client, with skein's heads-up; temper's stored record; the words in the brief's log and the tool's refusal), recommended; yes in skein's interface only, kept in memory and dropped at rest, so a restart's replayed answer says unknown; or no, the words name the client's configured bounds (rows 8, answer bytes 255,570 in the reference) without a measure."
parts = ["review-files"]
