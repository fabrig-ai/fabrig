[package]
name = "temper-engine-forge-world"
description = "Forge connector top against a scripted root and independent fake forge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
temper-client-protocol-wire.workspace = true
skein-forge.workspace = true
jig-domain-people.workspace = true
skein-lib.workspace = true
temper-engine-domain-forge.workspace = true
temper-protocol-reaches.workspace = true
temper-engine-domain-forge-tiers.workspace = true
skein-forge-client.workspace = true
temper-engine-domain-forge-issues = { path = "../../../crates/temper-engine-domain-forge-issues" }
temper-engine-domain-forge-change = { path = "../../../crates/temper-engine-domain-forge-change" }
skein-fake-forge-domain.workspace = true

temper-engine-domain-forge-landing = { path = "../../../crates/temper-engine-domain-forge-landing" }

[dev-dependencies]
skein-world.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
