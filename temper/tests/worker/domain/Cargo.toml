[package]
name = "temper-worker-domain-world"
description = "The complete worker with Smith processes, the fake forge and disk, and typed replay stories"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-domain-link.workspace = true
skein-world.workspace = true
skein-lib.workspace = true
smith-channel.workspace = true
smith-charter.workspace = true
smith-domain-run.workspace = true
smith-domain-session.workspace = true
smith-protocol-channel.workspace = true
smith-transcript.workspace = true
temper-worker-domain.workspace = true
temper-worker-checkout-world.workspace = true
temper-fake-checkout.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
