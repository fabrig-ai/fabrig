[package]
name = "temper-worker-checkout-world"
description = "The checkout child domain's world: a simulation against a fake forge and a fake disk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
temper-fake-git.workspace = true
skein-io.workspace = true
skein-fake-peers.workspace = true
skein-fake-forge-forgejo.workspace = true
temper-worker-protocol-git.workspace = true
skein-world.workspace = true
skein-lib.workspace = true
temper-worker-domain-checkout.workspace = true
temper-fake-checkout.workspace = true
skein-fake-forge-domain.workspace = true

[dev-dependencies]
skein-throwaway-forgejo.workspace = true
skein-scratch.workspace = true
temper-test-env.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
