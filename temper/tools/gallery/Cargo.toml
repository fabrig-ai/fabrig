[package]
name = "temper-client-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "temper-client-gallery"
path = "src/main.rs"

[dependencies]
skein-fail-stop.workspace = true
temper-client-view.workspace = true
temper-client-domain.workspace = true
temper-client-protocol-wire.workspace = true
temper-client-shell-terminal.workspace = true
jig-client.workspace = true
skein-lib.workspace = true
skein-ui.workspace = true
skein-ui-web.workspace = true
skein-ui-bundle.workspace = true

[dev-dependencies]
skein-fake-person.workspace = true
skein-scratch.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
