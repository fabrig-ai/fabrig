[package]
name = "temper-client"
description = "The deployment's client binary"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "temper-client"
path = "main.rs"
test = false

[[test]]
name = "suite"
path = "tests/suite/main.rs"

[dependencies]
temper-client-shell.workspace = true
skein-fail-stop.workspace = true
temper-version.workspace = true

[dev-dependencies]
skein-scratch.workspace = true
temper-shell.workspace = true
[lints.rust] # binary: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
