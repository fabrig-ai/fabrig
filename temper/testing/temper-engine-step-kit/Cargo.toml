[package]
name = "temper-engine-step-kit"
description = "Fixtures for focused engine root tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
jig-domain-core.workspace = true
jig-domain-tasks.workspace = true
jig-protocol-config-fixtures.workspace = true
jig-test-profile.workspace = true
skein-forge.workspace = true
skein-lib.workspace = true
temper-engine-domain-limits.workspace = true
temper-engine-domain-store.workspace = true
temper-engine-domain-forge.workspace = true
temper-limits-fixtures.workspace = true
[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
