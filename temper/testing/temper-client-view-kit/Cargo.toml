[package]
name = "temper-client-view-kit"
description = "Shared fixtures for the view's tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
jig-client.workspace = true
jig-client-protocol-link.workspace = true
jig-client-protocol-wire.workspace = true
jig-client-test-records.workspace = true
skein-fake-person.workspace = true
skein-lib.workspace = true
skein-ui.workspace = true
skein-ui-text.workspace = true
temper-client-domain.workspace = true
temper-client-protocol-wire.workspace = true
temper-client-view-words.workspace = true
temper-docs.workspace = true
temper-fixtures.workspace = true
temper-protocol-reaches = { path = "../../crates/temper-protocol-reaches" }

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
