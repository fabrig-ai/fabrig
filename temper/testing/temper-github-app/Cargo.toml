[package]
name = "temper-github-app"
description = "The fake GitHub App and its durable start records"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
temper-protocol-records.workspace = true
temper-protocol-records-forge.workspace = true
temper-protocol-store.workspace = true
temper-engine-service.workspace = true
jig-protocol-config.workspace = true
jig-protocol-store.workspace = true
jig-domain-core.workspace = true
skein-fake-forge-github.workspace = true
skein-forge-connection.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true

[dev-dependencies]
skein-scratch.workspace = true
skein-forge.workspace = true
skein-forge-setup.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
