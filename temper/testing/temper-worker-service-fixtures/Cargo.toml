[package]
name = "temper-worker-service-fixtures"
description = "Worker service fixtures for composition tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
temper-worker-service.workspace = true
jig-domain-host.workspace = true
jig-domain-link.workspace = true
jig-protocol-config.workspace = true
jig-protocol-worker-link.workspace = true
smith-host-domain.workspace = true
smith-host-protocol.workspace = true
smith-protocol-channel.workspace = true
smith-agent-world.workspace = true
smith-channel.workspace = true
smith-charter.workspace = true
smith-transcript.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
temper-worker-domain.workspace = true
temper-worker-protocol-git.workspace = true
temper-protocol-worker-wire.workspace = true
[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
