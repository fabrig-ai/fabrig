[package]
name = "temper-service-link-fixtures"
description = "Shared engine and worker channel fixtures for service boundary tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false

[dependencies]
temper-engine-service.workspace = true
temper-engine-smith.workspace = true
temper-engine-domain.workspace = true
temper-engine-domain-forge.workspace = true
temper-worker-service.workspace = true
temper-worker-service-fixtures.workspace = true
temper-worker-domain.workspace = true
temper-worker-protocol-git-world.workspace = true
temper-limits-fixtures.workspace = true
temper-protocol-worker-wire.workspace = true
jig-protocol-config.workspace = true
jig-protocol-config-fixtures.workspace = true
jig-protocol-engine-workers.workspace = true
jig-protocol-worker-wire.workspace = true
jig-domain-link.workspace = true
jig-domain-core.workspace = true
jig-domain-tasks.workspace = true
jig-domain-host.workspace = true
jig-domain-authority.workspace = true
jig-domain-fleet.workspace = true
smith-protocol-channel.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-channel.workspace = true
skein-forge.workspace = true
[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
