jig-channel-kit.workspace = true
skein-tls-kit.workspace = true
serde_json.workspace = true

[[test]]
name = "process"
path = "tests/process.rs"

[[test]]
name = "live"
path = "tests/live.rs"

[lints.rust] # binary: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"


[[test]]
name = "live_github"
path = "tests/live_github.rs"

[[test]]
name = "live_github_managed"
path = "tests/live_github_managed.rs"

[[test]]
name = "suite"
path = "tests/suite/main.rs"

[[test]]
name = "proof_live"
path = "tests/proof_live.rs"
