[package]
name = "temper"
description = "Temper's standalone service and agent command"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "temper"
path = "src/main.rs"
test = false

[features]
record = ["temper-client-shell-tui/record"]

[dependencies]
temper-engine-shell.workspace = true
temper-fetch-shell.workspace = true
temper-shell.workspace = true
settings-form.workspace = true
temper-docs.workspace = true
skein-fail-stop.workspace = true
temper-engine-domain-forge.workspace = true
temper-fake-git.workspace = true
temper-fake.workspace = true
skein-fake-forge-forgejo.workspace = true
skein-fake-peers.workspace = true
temper-init.workspace = true
temper-client-bundle.workspace = true
temper-client-shell-cli.workspace = true
temper-client-tools.workspace = true
skein-forge.workspace = true
jig-client-protocol-link.workspace = true
temper-service = { workspace = true, features = ["worker"] }
temper-box.workspace = true
temper-forge-setup.workspace = true
temper-forge-setup-shell.workspace = true
temper-client-shell-terminal.workspace = true
temper-client-shell-tui.workspace = true
temper-client-tui.workspace = true
skein-ui-screen.workspace = true
skein-ui-screen-terminal.workspace = true
skein-ui.workspace = true
temper-worker-domain.workspace = true
skein-forge-connection.workspace = true
jig-protocol-config.workspace = true
jig-domain-host.workspace = true
jig-domain-link.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-json.workspace = true
skein-shell.workspace = true
skein-tls.workspace = true
skein-oauth-accounts.workspace = true
skein-oauth.workspace = true
smith-agent-service.workspace = true
smith-local-domain.workspace = true
smith-agent-shell.workspace = true
smith-host-domain.workspace = true
smith-local-service.workspace = true
smith-host-protocol.workspace = true

jig-domain-core.workspace = true
jig-protocol-store.workspace = true
temper-protocol-store.workspace = true
skein-fake-forge-domain.workspace = true
skein-kv.workspace = true

[dev-dependencies]
temper-fetch.workspace = true
jig-client-kit.workspace = true
temper-engine-domain-world = { path = "../../tests/engine/domain" }
temper-fixtures.workspace = true
temper-client-protocol-wire.workspace = true
temper-playground.workspace = true
jig-domain-people.workspace = true
jig-test-profile.workspace = true
temper-client-shell-web.workspace = true
smith-agent-world.workspace = true
smith-domain-run.workspace = true
smith-protocol-program.workspace = true
temper-client-world = { path = "../../tests/client" }
temper-engine-smith.workspace = true
jig-protocol-engine-clients.workspace = true
skein-scratch.workspace = true
jig-client.workspace = true
jig-client-protocol-wire.workspace = true
skein-fake-oauth.workspace = true
skein-http.workspace = true
skein-forge-client.workspace = true
temper-worker-protocol-git.workspace = true
temper-worker-domain-checkout.workspace = true
jig-domain-fleet.workspace = true
jig-domain-tasks.workspace = true
skein-fake-llm-domain.workspace = true
skein-llm.workspace = true
rustls = { workspace = true, features = ["std"] }
temper-real-loop-world = { path = "../../tests/real-loop" }
smith-fake-claude.workspace = true
smith-local-process-world.workspace = true
temper-engine-domain.workspace = true
skein-throwaway-forgejo.workspace = true
