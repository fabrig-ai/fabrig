[package]
name = "temper-forge-setup-shell"
description = "Hosts of owned forge setup commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
temper-fetch-shell.workspace = true
temper-forge-setup.workspace = true
skein-io.workspace = true
skein-http.workspace = true
skein-tls.workspace = true
skein-lib.workspace = true
skein-shell.workspace = true

[dev-dependencies]
skein-world.workspace = true
skein-scratch.workspace = true
skein-tls-kit.workspace = true
rustls-std.workspace = true
jig-protocol-config.workspace = true

[lints.rust] # binary: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

