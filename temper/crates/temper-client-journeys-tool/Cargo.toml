[package]
name = "temper-client-journeys-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[test]]
name = "suite"
path = "tests/suite/main.rs"

[dependencies]
temper-client-shell-tui = { workspace = true, features = ["record"] }
temper-client-tui.workspace = true
skein-ui-screen.workspace = true
skein-ui-screen-terminal.workspace = true
temper-client-shell-web.workspace = true
skein-ui.workspace = true
skein-ui-bundle.workspace = true
skein-ui-web.workspace = true
skein-browser.workspace = true
skein-fake-person.workspace = true
skein-fake-person-browser.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true

[dev-dependencies]
jig-client.workspace = true
skein-scratch.workspace = true

[lints.rust] # harness: tools/lints/design.md, 2.2
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "allow"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
