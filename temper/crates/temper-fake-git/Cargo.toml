[package]
name = "temper-fake-git"
description = "The fake git program's core: its checks, answers, step core and transports"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true
skein-http.workspace = true
skein-json.workspace = true
skein-forge.workspace = true
skein-fake-checkout.workspace = true
skein-fake-forge-domain.workspace = true
skein-fake-forge-protocol.workspace = true
skein-fake-peers.workspace = true
temper-worker-protocol-git.workspace = true
temper-worker-domain-checkout.workspace = true

[dev-dependencies]
skein-fake-machine = { path = "../../../skein/crates/skein-fake-machine" }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
