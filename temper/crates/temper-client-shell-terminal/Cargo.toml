[package]
name = "temper-client-shell-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
browser-root = []

[dependencies]
jig-client-protocol-http.workspace = true
jig-client.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-http.workspace = true
skein-shell.workspace = true
skein-ui.workspace = true
skein-ui-text.workspace = true
jig-client-protocol-link.workspace = true
jig-client-protocol-wire.workspace = true
jig-client-shell-native.workspace = true
temper-client-domain.workspace = true
temper-client-view.workspace = true
temper-client-protocol-wire.workspace = true

[dev-dependencies]
skein-scratch.workspace = true
skein-sim = { path = "../../../skein/crates/skein-sim" }
jig-client-world.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
