# What macOS runs (temper/docs/design/testing/README.md, 2.8): every target
# compiled, then the one story. A red run blocks nothing: it is a finding.
name: macos

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per ref; a new run waits, and a later run
# takes the waiting one's place.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.95"
  NEXTEST_VERSION: 0.9.148
  NEXTEST_SHA256: 6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # The runner's disk is small (14 GB documented): line tables keep
  # backtraces' places at a fraction of full debug information's size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # testing-strategy.md, section 8: nextest starts each test directly.
  NEXTEST_DOUBLE_SPAWN: "0"
  TEMPER_INTERNAL_BUNDLE: none

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Each check runs through $RUNNER_TEMP/run, which keeps its output and,
      # when it fails, gives its failing tests or errors and the output's
      # tail as error annotations, so that a failure reads through the
      # public API without the logs.
      # Every check runs once the tools are in, whatever an earlier one
      # gave, so that one run shows every failure.
      - name: The runner of each check
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cat >"$RUNNER_TEMP/annotate.py" <<'EOF'
          import re, sys
          name, path = sys.argv[1:]
          text = open(path, encoding="utf-8", errors="replace").read()
          lines = text.splitlines()
          def escape(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def error(title, body):
              title = escape(title).replace(":", "%3A").replace(",", "%2C")
              print(f"::error title={title}::{escape(body)}")
          failed = [l.strip() for l in lines
                    if re.match(r"\s+(FAIL|SIGSEGV|SIGABRT|SIGKILL|TIMEOUT|LEAK-FAIL)\s+\[", l)]
          headlines = [l for l in lines if re.match(r"(error(\[E\d+\])?|warning): ", l)]
          found = failed or headlines
          error(f"{name}: {len(found)} failed", "\n".join(dict.fromkeys(found))[-30000:] or "no test or error line found")
          tail = "\n".join(lines[-1200:])
          size = 30000
          chunks = [tail[i:i + size] for i in range(0, len(tail), size)][-4:]
          for i, chunk in enumerate(chunks, 1):
              error(f"{name}: output's tail {i}/{len(chunks)}", chunk)
          EOF
          cat >"$RUNNER_TEMP/run" <<'EOF'
          #!/bin/bash
          # run NAME COMMAND...
          name=$1
          shift
          log="$RUNNER_TEMP/logs/$name.log"
          "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
              python3 -I "$RUNNER_TEMP/annotate.py" "$name" "$log"
          fi
          exit "$status"
          EOF
          chmod +x "$RUNNER_TEMP/run"
          echo "RUN=$RUNNER_TEMP/run" >>"$GITHUB_ENV"

      - name: Rust at the workspace's rust-version, and cargo-nextest
        id: rust
        run: |
          # rustup is on the image; no installer script runs here.
          if ! command -v rustup >/dev/null; then
              echo "::error title=rustup::rustup is not on the macos-26 image"
              exit 1
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          curl -sSfL -o "$RUNNER_TEMP/nextest.tar.gz" \
              "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-universal-apple-darwin.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin"
          rustc --version
          cargo nextest --version
          uname -a

      # The registry by the lock; the target by the lock and the toolchain,
      # saved once per key: the dependencies stay built, and the workspace's
      # own crates build again in each run.
      - name: Restore the registry
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-macos-26-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-macos-26-
      - name: Restore the target
        id: target
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target
          key: target-macos-26-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-macos-26-rust-${{ env.RUST_VERSION }}-

      - name: Compile every target
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: $RUN compile cargo check --workspace --exclude 'hearth*' --all-targets --keep-going

      - name: Save the registry
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-macos-26-${{ hashFiles('Cargo.lock') }}
        continue-on-error: true
      - name: Save the target
        if: always() && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target
          key: target-macos-26-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
        continue-on-error: true

      - name: The pinned binaries, through temper forge fetch
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        id: fetch
        run: |
          $RUN build cargo build -p temper-box --bin temper-box
          $RUN build-fake-claude cargo build -p smith-fake-claude --bin fake-claude
          root="$RUNNER_TEMP/fetch"
          mkdir -m 700 "$root" "$root/config" "$root/data" "$root/cache"
          flags=(--config "$root/config" --data "$root/data" --cache "$root/cache")
          $RUN init target/debug/temper-box init "${flags[@]}" --box
          mkdir -p "$root/data/box/groups"
          printf 'owned\n' >"$root/data/box/groups/1"
          $RUN fetch target/debug/temper-box forge fetch "${flags[@]}" 1
          forgejo=$(echo "$root"/cache/forgejo/*/forgejo)
          runner=$(echo "$root"/cache/forgejo-runner/*/forgejo-runner)
          $RUN forgejo-runs "$forgejo" --version
          $RUN runner-runs "$runner" --version
          echo "TEMPER_TEST_FORGEJO=$forgejo" >>"$GITHUB_ENV"
          echo "TEMPER_TEST_FORGEJO_RUNNER=$runner" >>"$GITHUB_ENV"

      - name: The one story
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.fetch.outcome == 'success' }}
        run: |
          $RUN story cargo nextest run --profile process-temper -p temper-box --test process \
              -E 'test(=a_csv_change_passes_ci_and_a_blocking_agent_review_on_the_owned_forge_then_lands_and_survives_restart)'

      - name: The disk
        if: always()
        run: df -h "$GITHUB_WORKSPACE" && du -sh target ~/.cargo/registry || true
