# Apple Silicon's file for the site (temper/docs/design/release.md, 5.1):
# temper built for release at the dispatched commit, stripped and signed
# again ad hoc, checked, and left as the run's artifact. It writes nothing
# to the repository and uses no secret.
name: release-macos

on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, whatever the ref; a new run waits, and a later run
# takes the waiting one's place.
concurrency:
  group: release-macos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  release-macos:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Rust from the workspace's toolchain file, with wasm32 for the browser's bundle
        run: |
          # rustup is on the image; no installer script runs here.
          if ! command -v rustup >/dev/null; then
              echo "::error title=rustup::rustup is not on the macos-26 image"
              exit 1
          fi
          rustup --version
          rustup toolchain install
          rustc --version
          uname -a

      # The registry by macos.yml's keys, restored and never saved here;
      # the release's target is never cached.
      - name: Restore the registry
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-macos-26-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-macos-26-

      - name: The build, under the release profile as the workspace has it
        run: TEMPER_INTERNAL_BUNDLE=embed cargo build --release --locked -p temper-box --bin temper-box

      # Stripping invalidates the linker's ad hoc signature, without which
      # Apple Silicon runs no file; codesign makes it again, in place, so
      # the checks and the artifact below take the stripped file.
      - name: Stripped by Xcode's strip, and signed again ad hoc
        run: |
          xcrun --find strip
          ls -l target/release/temper-box
          xcrun strip target/release/temper-box
          ls -l target/release/temper-box
          codesign --force --sign - target/release/temper-box
          if ! codesign --verify --verbose target/release/temper-box; then
              echo "::error title=codesign::target/release/temper-box's signature does not verify after the strip"
              exit 1
          fi
          codesign --display --verbose=2 target/release/temper-box

      - name: An arm64 Mach-O executable
        run: |
          kind=$(file -b target/release/temper-box)
          echo "$kind"
          if [[ $kind != *"Mach-O 64-bit"* || $kind != *executable* || $kind != *arm64* ]]; then
              echo "::error title=file::target/release/temper-box is not an arm64 Mach-O executable: $kind"
              exit 1
          fi

      - name: It prints its usage
        run: |
          status=0
          ./target/release/temper-box --help >"$RUNNER_TEMP/help.txt" || status=$?
          cat "$RUNNER_TEMP/help.txt"
          first=$(head -n 1 "$RUNNER_TEMP/help.txt")
          if [ "$status" -ne 0 ] || [[ $first != "usage: temper-box "* ]]; then
              echo "::error title=temper-box --help::exit $status, first line: $first"
              exit 1
          fi

      - name: The artifact's two files
        run: |
          mkdir "$RUNNER_TEMP/artifact"
          cp target/release/temper-box "$RUNNER_TEMP/artifact/temper"
          git rev-parse HEAD >"$RUNNER_TEMP/artifact/commit"
          cat "$RUNNER_TEMP/artifact/commit"

      - name: Upload temper-Darwin-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temper-Darwin-arm64
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error
          retention-days: 7
