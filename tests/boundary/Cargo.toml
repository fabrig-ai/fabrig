[package]
name = "fabrig-boundary"
description = "Checks the repository's boundaries: the trees' dependencies point one way, and no file names an outside lab"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
serde_json.workspace = true
syn.workspace = true

[dev-dependencies]
skein-codec.workspace = true
skein-codegen.workspace = true
skein-scratch.workspace = true
skein-shell.workspace = true

# Ordinary Rust (skein's programming-model.md, 10.2), held to the test
# crates' lints.
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
